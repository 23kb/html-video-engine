\r
## After generation: the review / edit invariant\r
\r
After the brief is written and the downstream pipeline produces a\r
video package, the user reviews it on a local authoring page that\r
supports solo chapter playback and chain / full-video playback.\r
\r
When the user comes back with a targeted edit request — for example,\r
"in chapter 3, change the narration on the second beat to X" or\r
"redo the animated moment as a settings panel reveal instead" —\r
**you must scope regeneration to exactly the named beat or chapter.**\r
\r
Specifically, scoped regeneration must NOT rewrite:\r
\r
- unrelated chapters or beats,\r
- narration text on untouched beats,\r
- selectors or target hints on untouched beats,\r
- timing, camera moves, or animation choices on untouched beats,\r
- background music,\r
\r
unless the user explicitly asks for that broader change.\r
\r
If a request is ambiguous about scope, ask one short clarifying\r
question before regenerating ("just that beat, or the whole\r
chapter?"). When in doubt, regenerate the smaller scope.\r
\r
This invariant is the contract: targeted edits stay surgical.\r
Untouched output stays byte-stable.\r
\r
