\r
- Mode C (`surveys-and-polls*` bespoke cinematic announcements). Do\r
  not handle these here.\r
- Snapshot capture, `catalog.md` generation, selector picking,\r
  validator runs, and TTS rendering are out of scope for this\r
  prompt/intake step — they are not part of the 5-question skill\r
  intake. They may legitimately be part of a downstream authoring\r
  workflow; this skill simply does not perform them.\r
- Edits to `engine/`, `runtime/`, `scenes/`, `capture/`, or\r
  `tools/`. Author-mode output may only write/update files under\r
  `videos/<slug>/`.\r
- Refreshing the validator baseline.\r
- Writing memory files.\r
- Retrofitting existing videos with `brief.md`."""
