<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 000 — Cursor inertia · REAL admin-templates page</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#F4F1EC; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }

  /* Loading shim */
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#F4F1EC; color:#646970; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #dcdcde; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Effect chrome — overlaid on real WPForms admin */
  .brand-tag { position:absolute; top:24px; right:24px; display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; background:rgba(20,17,14,0.85); color:#fff; font-size:12px; font-weight:600; z-index:30; opacity:0; }
  .brand-tag .dot { width:8px; height:8px; border-radius:50%; background:var(--wpf-orange); }
  .brand-tag .lbl { letter-spacing:0.06em; text-transform:uppercase; }
  .effect-title { position:absolute; top:24px; left:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }

  /* Ghost cursor — orbits over the real admin page */
  .ghost-cursor { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 22px rgba(226,119,48,0.7), 0 2px 8px rgba(0,0,0,0.3); pointer-events:none; z-index:40; transform:translate(-50%,-50%); opacity:0; }
  .ghost-cursor::after { content:''; position:absolute; inset:-5px; border-radius:50%; border:2px solid rgba(226,119,48,0.35); }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real WPForms admin-templates snapshot…</div>

  <div class="effect-title"><b>EFFECT 000</b> · cursor inertia · admin/templates</div>
  <div class="brand-tag"><div class="dot"></div><div class="lbl">Live WP Admin</div></div>
  <div class="ghost-cursor" id="cursor"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 000 · ghost cursor over REAL .wpforms-template cards (DOM mutation on iframe nodes)</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>

<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng = mulberry32(0);

  const stage = document.getElementById('stage');
  function fit() {
    stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;
  }
  addEventListener('resize', fit); fit();

  // Mount the REAL admin-templates snapshot at native 1280×720, scale 1.5× to fill stage
  const { iframe, ready, query, elementToStageRect } = SnapshotIframe.mountSnapshot(stage, {
    slug: 'admin-templates',
    x: 0, y: 0,
    w: 1280, h: 720,
    scale: 1.5
  });

  ready.then(async () => {
    await SnapshotIframe.awaitDom(query, '.wpforms-template', { min: 10 });

    // Scroll iframe content so the template grid is centered in the viewport.
    // The captured page has WP sidebar + admin chrome + search above the cards;
    // without scrolling, the cards sit in the bottom half of the iframe.
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;
    const list = doc.getElementById('wpforms-setup-templates-list');
    let scrollTarget = 380;
    if (list) {
      const r = list.getBoundingClientRect();
      scrollTarget = Math.max(0, r.top + (win.pageYOffset || 0) - 20);
    }
    win.scrollTo(0, scrollTarget);
    if (doc.documentElement) doc.documentElement.scrollTop = scrollTarget;
    if (doc.body) doc.body.scrollTop = scrollTarget;
    // give layout a tick so getBoundingClientRect reflects the new scroll
    await new Promise(r => setTimeout(r, 60));

    document.getElementById('loading').classList.add('gone');

    // Pick real cards that are visible in the post-scroll iframe viewport,
    // measure their centers, and convert to stage coords (×SCALE=1.5).
    const SCALE = 1.5;
    const visibleCards = [...doc.querySelectorAll('.wpforms-template')].filter(c => {
      const r = c.getBoundingClientRect();
      return r.top >= -20 && r.top < 700 && r.left >= 0 && r.left < 1260;
    }).slice(0, 24);

    const cardCenters = visibleCards.map(c => {
      const r = c.getBoundingClientRect();
      return { x: SCALE * (r.left + r.width/2), y: SCALE * (r.top + r.height/2) };
    });

    const cursorEl = document.getElementById('cursor');
    const tl = gsap.timeline({ paused: true });

    tl.to('.brand-tag', { opacity: 1, duration: 0.5 }, 0.1);
    tl.to('.effect-title', { opacity: 1, duration: 0.5 }, 0.2);
    tl.to(cursorEl, { opacity: 1, duration: 0.4 }, 0.4);

    // Choreographed cursor path that VISITS actual cards. Pick 8 cards in a
    // zig-zag pattern across the grid so the cursor visibly lands on them.
    const N = Math.min(cardCenters.length, 8);
    const picks = [];
    for (let i = 0; i < N; i++) {
      // alternate rows for a zig-zag feel
      const idx = (i % 2 === 0) ? i : (cardCenters.length - 1 - i);
      picks.push(cardCenters[idx] || cardCenters[i]);
    }
    const waypoints = picks.map((p, i) => ({ x: p.x, y: p.y, t: 0.6 + i * 1.1 }));

    const cs = { x: waypoints[0].x, y: waypoints[0].y };
    gsap.set(cursorEl, { x: cs.x, y: cs.y });

    let last = waypoints[0];
    for (let i = 1; i < waypoints.length; i++) {
      const w = waypoints[i];
      tl.to(cs, {
        x: w.x, y: w.y,
        duration: w.t - last.t,
        ease: 'power2.inOut',
        onUpdate: () => gsap.set(cursorEl, { x: cs.x, y: cs.y })
      }, last.t + 0.4);
      last = w;
    }

    // DOM MUTATION on real cards: each card has a kicked flag; whenever the
    // cursor comes within proximity (in stage coords), the real captured
    // .wpforms-template node is kicked by inertia, then snaps back with elastic.
    const cardStates = visibleCards.map(() => ({ kicked: false }));
    let prevX = cs.x, prevY = cs.y;
    gsap.ticker.add(() => {
      if (tl.paused() || tl.progress() === 0) return;
      visibleCards.forEach((card, i) => {
        const r = card.getBoundingClientRect();
        const cx = SCALE * (r.left + r.width/2);
        const cy = SCALE * (r.top + r.height/2);
        const dist = Math.hypot(cs.x - cx, cs.y - cy);
        if (dist < 140 && !cardStates[i].kicked) {
          cardStates[i].kicked = true;
          const vx = (cs.x - prevX) * 5;
          const vy = (cs.y - prevY) * 5;
          // mutate the REAL captured WPForms element
          gsap.to(card, { x: vx, y: vy, duration: 0.4, ease: 'power3.out', overwrite: 'auto' });
          gsap.to(card, { x: 0, y: 0, rotate: (rng()-0.5)*14, duration: 0.9, delay: 0.4, ease: 'elastic.out(1,0.5)', overwrite: 'auto' });
          gsap.to(card, { rotate: 0, duration: 0.6, delay: 1.0, ease: 'sine.inOut', overwrite: false });
          setTimeout(() => cardStates[i].kicked = false, 1500);
        }
      });
      prevX = cs.x; prevY = cs.y;
    });

    // wire scrubber
    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  }).catch(err => {
    document.getElementById('loading').textContent = 'Failed to load snapshot: ' + err.message;
  });
</script></body></html>
