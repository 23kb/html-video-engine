<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 001 — Card stack spread · REAL admin-templates cards</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#14110e; font-family:var(--wpf-font-stack); overflow:hidden; color:var(--wpf-ink); }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#F4F1EC; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.35); }

  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#F4F1EC; color:#646970; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #dcdcde; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* dim overlay over the real admin background so the 5 featured cards pop */
  .dim { position:absolute; inset:0; background:rgba(20,17,14,0.55); opacity:0; z-index:10; pointer-events:none; }

  .effect-title { position:absolute; top:24px; left:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }

  .title-block { position:absolute; top:100px; left:0; right:0; text-align:center; z-index:20; opacity:0; color:#fff; }
  .title-block .kicker { color:var(--wpf-orange); font-size:18px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px; }
  .title-block .title { font-size:78px; font-weight:700; color:#fff; letter-spacing:-0.025em; line-height:1.05; text-shadow:0 4px 24px rgba(0,0,0,0.6); }

  .caption { position:absolute; bottom:80px; left:0; right:0; text-align:center; opacity:0; z-index:20; color:#fff; }
  .caption .line1 { font-size:24px; color:#f3ede2; font-weight:500; }
  .caption .line2 { color:#c8c0b3; font-size:17px; margin-top:6px; }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; font-family:inherit; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real admin-templates page…</div>
  <div class="dim"></div>
  <div class="effect-title"><b>EFFECT 001</b> · stack &amp; spread · real .wpforms-template cards</div>
  <div class="title-block">
    <div class="kicker">800+ templates</div>
    <div class="title">Pick a form. Ship in minutes.</div>
  </div>
  <div class="caption">
    <div class="line1">From contact to commerce — one builder.</div>
    <div class="line2">Drag, drop, publish.</div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 001 · 5 REAL .wpforms-template cards lifted from grid → stack → spread</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit() { stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  const SCALE = 1.5;
  const { iframe, ready, query, queryOne } = SnapshotIframe.mountSnapshot(stage, {
    slug: 'admin-templates', x: 0, y: 0, w: 1280, h: 720, scale: SCALE
  });

  ready.then(async () => {
    await SnapshotIframe.awaitDom(query, '.wpforms-template', { min: 10 });
    document.getElementById('loading').classList.add('gone');

    // Pick the first 5 visible cards (Generate AI, Blank, then 3 templates)
    const cards = [...query('.wpforms-template')].slice(0, 5);

    // Capture each card's natural iframe-content position
    const rects = cards.map(c => {
      const r = c.getBoundingClientRect();
      return { x: r.left, y: r.top, w: r.width, h: r.height };
    });

    // Lift cards into a foreground layer — give them high z-index in iframe doc
    // and a temporary shadow so they pop above the dim overlay
    cards.forEach(c => {
      c.style.position = 'relative';
      c.style.zIndex = '9999';
      c.style.boxShadow = '0 24px 60px rgba(0,0,0,0.45), 0 6px 16px rgba(0,0,0,0.25)';
      c.style.borderRadius = '8px';
      c.style.background = '#fff';
      c.style.transition = 'none';
    });

    // Stack point: iframe-content (640, 320) so it lands at stage (960, 480) after 1.5× scale
    const stackX = 640 - rects[0].w / 2;
    const stackY = 320 - rects[0].h / 2;

    // Initial stack — all cards converge on the stack point
    cards.forEach((c, i) => {
      const r = rects[i];
      const dx = stackX - r.x;
      const dy = stackY - r.y + i * 8;
      gsap.set(c, {
        x: dx, y: dy,
        rotate: 0,
        scale: 1 - i * 0.02,
        zIndex: 9999 - i,
        transformOrigin: 'center bottom'
      });
    });

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

    tl.to('.dim', { opacity: 1, duration: 0.6 }, 0.2);
    tl.to('.effect-title', { opacity: 1, duration: 0.5 }, 0.1);
    tl.to('.title-block', { opacity: 1, duration: 0.7 }, 0.4);
    tl.from('.title-block .kicker', { y: 20, opacity: 0, duration: 0.6 }, 0.4);
    tl.from('.title-block .title', { y: 30, opacity: 0, duration: 0.7 }, 0.55);

    // breathe before spreading
    tl.to(cards[0], { y: '-=10', duration: 0.5, ease: 'sine.out' }, 0.8)
      .to(cards[0], { y: '+=10', duration: 0.5, ease: 'sine.in' }, 1.3);

    // SPREAD: deal cards horizontally outward in iframe coords
    const spreadStart = 1.8;
    const spacing = 260;          // px between final centers in iframe coords
    const N = cards.length;
    cards.forEach((card, i) => {
      const r = rects[i];
      const offset = (i - (N - 1) / 2) * spacing;
      const finalX = (640 - r.w / 2) + offset - r.x;
      const finalY = (320 - r.h / 2) + Math.abs(i - 2) * 14 - r.y;
      const tilt = (i - (N - 1) / 2) * 4;
      tl.to(card, {
        x: finalX,
        y: finalY,
        rotate: tilt,
        scale: 1,
        duration: 1.4,
        ease: 'power3.out'
      }, spreadStart + i * 0.08);
    });

    tl.to('.title-block', { y: -12, duration: 1.2, ease: 'power2.out' }, spreadStart + 0.2);

    // Lift the center card
    const centerCard = cards[2];
    const cr = rects[2];
    tl.to(centerCard, {
      x: (640 - cr.w / 2) - cr.x,
      y: (320 - cr.h / 2) - cr.y - 24,
      scale: 1.06,
      duration: 0.8,
      ease: 'power2.out'
    }, spreadStart + 1.6);

    tl.to('.caption', { opacity: 1, duration: 0.8 }, spreadStart + 2.2);
    tl.from('.caption .line1', { y: 18, opacity: 0, duration: 0.6 }, spreadStart + 2.2);
    tl.from('.caption .line2', { y: 14, opacity: 0, duration: 0.6 }, spreadStart + 2.4);

    // gentle settle
    tl.to(cards, { y: '+=2', duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: { each: 0.05, from: 'center' } }, spreadStart + 3);

    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  }).catch(err => {
    document.getElementById('loading').textContent = 'Failed: ' + err.message;
  });
</script></body></html>
