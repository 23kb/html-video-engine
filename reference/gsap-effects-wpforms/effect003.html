<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 003 — Shuffle fan · REAL admin-templates cards on pivots</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdf8f0 0%,#e9dec8 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }

  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fdf8f0; color:#646970; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #dcdcde; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* dim the background admin iframe so the 7 featured cards pop */
  .dim { position:absolute; inset:0; background:rgba(253,248,240,0.78); opacity:0; z-index:10; pointer-events:none; }

  .effect-title { position:absolute; top:24px; left:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }

  .header { position:absolute; top:100px; left:0; right:0; text-align:center; opacity:0; z-index:20; }
  .header .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:10px; }
  .header .title { font-size:52px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }

  /* pivot rigs — each real card sits inside a rotating arm */
  .rigs { position:absolute; inset:0; z-index:25; pointer-events:none; }
  .rig { position:absolute; left:50%; bottom:-60%; width:1px; height:140%; transform-origin:50% 100%; transform:translateX(-50%) rotate(0deg); }
  .rig-slot { position:absolute; left:50%; top:170px; transform:translateX(-50%); }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real admin-templates page…</div>
  <div class="dim"></div>
  <div class="effect-title"><b>EFFECT 003</b> · pivot-arm shuffle · real .wpforms-template cards</div>
  <div class="header">
    <div class="kicker">A dealer-shuffle of templates</div>
    <div class="title">Pick your favorite.</div>
  </div>
  <div class="rigs" id="rigs"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 003 · 7 REAL .wpforms-template cards on pivot arms (DOM moved into stage)</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const { iframe, ready, query } = SnapshotIframe.mountSnapshot(stage, {
    slug: 'admin-templates', x: 0, y: 0, w: 1280, h: 720, scale: 1.5
  });

  ready.then(async () => {
    await SnapshotIframe.awaitDom(query, '.wpforms-template', { min: 10 });
    document.getElementById('loading').classList.add('gone');

    // Take 7 real cards and adopt them into the parent stage's pivot rigs.
    // We also import the iframe's stylesheets so the adopted cards render
    // correctly in the parent document.
    const sourceDoc = iframe.contentDocument;
    // skip the "Generate With AI" + "Blank Form" cards — real templates only
    const sourceCards = [...query('.wpforms-template')]
      .filter(c => c.id !== 'wpforms-template-generate' && c.id !== 'wpforms-template-blank')
      .slice(0, 7);

    // copy snapshot stylesheets into parent (one-time)
    sourceDoc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      const href = link.getAttribute('href');
      if (!href || document.head.querySelector(`link[data-from-snapshot="${href}"]`)) return;
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      // resolve relative paths into snapshot absolute paths
      const abs = href.startsWith('http') || href.startsWith('/')
        ? href
        : `../../snapshots/admin-templates/${href.replace(/^\.\//,'')}`;
      l.href = abs;
      l.dataset.fromSnapshot = href;
      document.head.appendChild(l);
    });

    // hide the iframe — we've extracted what we need
    iframe.style.opacity = '0.0';

    const rigsEl = document.getElementById('rigs');
    const rigs = [];
    sourceCards.forEach((card, i) => {
      // Fix relative image srcs BEFORE adopting (snapshot-relative → absolute)
      SnapshotIframe.rewriteRelativeUrls(card, 'admin-templates');
      const rig = document.createElement('div');
      rig.className = 'rig';
      const slot = document.createElement('div');
      slot.className = 'rig-slot';
      // compact playing-card treatment — crop the tall form screenshot
      card.style.cssText =
        'width:248px;height:312px;background:#fff;border-radius:14px;' +
        'box-shadow:0 18px 44px rgba(20,22,28,0.22),0 4px 12px rgba(20,22,28,0.10);' +
        'padding:0;overflow:hidden;display:flex;flex-direction:column;margin:0;position:relative;';
      const thumb = card.querySelector('.wpforms-template-thumbnail');
      if (thumb) thumb.style.cssText = 'height:156px;overflow:hidden;margin:0;padding:0;flex-shrink:0;border-bottom:1px solid #eee7da;';
      const tImg = thumb && thumb.querySelector('img');
      if (tImg) tImg.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top center;display:block;';
      const tName = card.querySelector('.wpforms-template-name');
      if (tName) tName.style.cssText = 'font-size:16.5px;font-weight:700;color:#1d2327;margin:15px 17px 0;padding:0;line-height:1.3;';
      const tDesc = card.querySelector('.wpforms-template-desc');
      if (tDesc) tDesc.style.cssText = 'font-size:12.5px;line-height:1.55;color:#5b6168;margin:9px 17px 16px;padding:0;' +
        'display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;';
      const tFav = card.querySelector('.wpforms-template-favorite');
      if (tFav) tFav.style.display = 'none';
      const tBtns = card.querySelector('.wpforms-template-buttons');
      if (tBtns) tBtns.style.display = 'none';
      slot.appendChild(card);
      rig.appendChild(slot);
      rigsEl.appendChild(rig);
      rigs.push(rig);
    });

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

    tl.to('.dim', { opacity: 1, duration: 0.6 }, 0.1);
    tl.to('.effect-title', { opacity: 1, duration: 0.5 }, 0.1);
    tl.to('.header', { opacity: 1, duration: 0.6 }, 0.3);
    tl.from('.header .kicker', { y: 18, opacity: 0, duration: 0.5 }, 0.3);
    tl.from('.header .title', { y: 22, opacity: 0, duration: 0.6 }, 0.45);

    rigs.forEach(r => { gsap.set(r, { rotation: 0, opacity: 0 }); gsap.set(r.querySelector('.rig-slot'), { y: 80, opacity: 0 }); });

    const fanStart = 1.0;
    const fanArc = 60;
    const N = rigs.length;
    const baseAngle = -fanArc / 2;
    rigs.forEach((r, i) => {
      const angle = baseAngle + (fanArc / (N - 1)) * i;
      const t = fanStart + i * 0.12;
      tl.to(r, { opacity: 1, rotation: angle, duration: 1.0, ease: 'back.out(1.3)' }, t);
      tl.to(r.querySelector('.rig-slot'), { y: 0, opacity: 1, duration: 0.8 }, t);
    });

    const centerIdx = Math.floor(N / 2);
    tl.to(rigs[centerIdx].querySelector('.rig-slot'), { y: -24, scale: 1.06, duration: 0.7, ease: 'power2.out' }, fanStart + N * 0.12 + 0.3);

    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  }).catch(err => {
    document.getElementById('loading').textContent = 'Failed: ' + err.message;
  });
</script></body></html>
