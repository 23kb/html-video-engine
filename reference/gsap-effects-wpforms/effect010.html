<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 010 — Sine-wave marquee · REAL template cards</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }

  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fdfaf3; color:#646970; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #dcdcde; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:30; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .effect-title { position:absolute; top:24px; right:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }
  .header { position:absolute; top:96px; left:0; right:0; text-align:center; opacity:0; z-index:25; }
  .header .kicker { color:var(--wpf-orange); font-size:13px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:8px; }
  .header .title { font-size:48px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }

  /* horizontal strip of REAL adopted template cards riding a sine wave */
  .container { position:absolute; top:54%; left:0; right:0; transform:translateY(-50%); height:440px; overflow:hidden; z-index:20; }
  .strip { position:absolute; top:50%; left:0; transform:translateY(-50%); display:flex; align-items:center; gap:26px; padding-left:26px; will-change:transform; }

  /* real template card — self-styled (the snapshot's CSS is ancestor-scoped
     and does not apply to nodes extracted out of the iframe).
     SOURCE: snapshots/admin-templates/index.html (.wpforms-template) */
  .strip .wpforms-template { width:230px; height:228px; flex-shrink:0; background:#fff;
    border:1px solid #e9e2d4; border-radius:14px; box-shadow:0 16px 36px rgba(20,22,28,0.18);
    display:flex; flex-direction:column; overflow:hidden; will-change:transform; }
  .strip .wpforms-template .wpforms-template-thumbnail { height:150px; overflow:hidden; flex-shrink:0; margin:0; padding:0; border-bottom:1px solid #eee7da; }
  .strip .wpforms-template .wpforms-template-thumbnail img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .strip .wpforms-template .wpforms-template-name { font-size:15px; font-weight:700; color:#1d2327; margin:0; padding:15px 16px 0; line-height:1.3; }
  .strip .wpforms-template .wpforms-template-desc,
  .strip .wpforms-template .wpforms-template-favorite,
  .strip .wpforms-template .wpforms-template-buttons { display:none; }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real admin-templates snapshot…</div>
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="effect-title"><b>EFFECT 010</b> · sine-wave marquee · real .wpforms-template cards</div>
  <div class="header"><div class="kicker">800+ templates</div><div class="title">A library always in motion.</div></div>
  <div class="container"><div class="strip" id="strip"></div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 010 · REAL template cards adopted from snapshots/admin-templates · horizontal scroll + per-card sine</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const { iframe, ready, query } = SnapshotIframe.mountSnapshot(stage, {
    slug: 'admin-templates', x: 0, y: 0, w: 1280, h: 720, scale: 1.5, zIndex: 1
  });

  ready.then(async () => {
    await SnapshotIframe.awaitDom(query, '.wpforms-template', { min: 12 });
    document.getElementById('loading').classList.add('gone');

    // Adopt 12 REAL template cards (skip the Generate-with-AI + Blank cards).
    const cards = [...query('.wpforms-template')]
      .filter(c => c.id !== 'wpforms-template-generate' && c.id !== 'wpforms-template-blank')
      .slice(0, 12);
    cards.forEach(c => SnapshotIframe.rewriteRelativeUrls(c, 'admin-templates'));
    iframe.style.opacity = '0';

    const strip = document.getElementById('strip');
    cards.forEach(c => strip.appendChild(c));
    cards.forEach(c => strip.appendChild(c.cloneNode(true)));   // dupe for seamless wrap
    const allCards = [...strip.querySelectorAll('.wpforms-template')];

    requestAnimationFrame(() => {
      const cycle = strip.scrollWidth / 2;
      const tl = gsap.timeline({ paused: true });
      tl.timeScale(3);  // speed-up per QC feedback
      tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
        .to('.effect-title', { opacity: 1, duration: 0.5 }, 0.15)
        .to('.header', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.25);

      // continuous left scroll with seamless wrap
      tl.to(strip, { x: `-=${cycle}`, duration: 20, ease: 'none',
        modifiers: { x: (s) => gsap.utils.wrap(-cycle, 0, parseFloat(s)) + 'px' } }, 0);

      // each card rides a phased sine wave — a card and its clone share phase
      allCards.forEach((c, i) => {
        gsap.set(c, { y: 26 });
        tl.to(c, { y: -26, duration: 1.15, ease: 'sine.inOut', yoyo: true, repeat: -1,
          delay: (i % 12) * 0.17 }, 0);
      });

      const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
      function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
      sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
      gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
      pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
      ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
    });
  });
</script></body></html>
