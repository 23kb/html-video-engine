<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 011 — Smooth R→L slide-in · REAL template cards</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdf8f0 0%,#e9dec8 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }

  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fdf8f0; color:#646970; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #dcdcde; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:30; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .effect-title { position:absolute; top:24px; right:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }
  .header { position:absolute; top:150px; left:0; right:0; text-align:center; opacity:0; z-index:25; }
  .header .kicker { color:var(--wpf-orange); font-size:13px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:10px; }
  .header .title { font-size:54px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }

  /* centered row of REAL adopted template cards, sliding in right -> left */
  .row { position:absolute; top:54%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:26px; z-index:20; perspective:1600px; }

  /* real template card — self-styled (snapshot CSS is ancestor-scoped).
     SOURCE: snapshots/admin-templates/index.html (.wpforms-template) */
  .row .wpforms-template { width:232px; height:286px; flex-shrink:0; background:#fff;
    border:1px solid #e9e2d4; border-radius:14px; box-shadow:0 18px 40px rgba(20,22,28,0.20);
    display:flex; flex-direction:column; overflow:hidden; will-change:transform,opacity; }
  .row .wpforms-template .wpforms-template-thumbnail { height:152px; overflow:hidden; flex-shrink:0; margin:0; padding:0; border-bottom:1px solid #eee7da; }
  .row .wpforms-template .wpforms-template-thumbnail img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .row .wpforms-template .wpforms-template-name { font-size:15.5px; font-weight:700; color:#1d2327; margin:0; padding:15px 16px 0; line-height:1.3; }
  .row .wpforms-template .wpforms-template-desc { font-size:12px; line-height:1.5; color:#5b6168; margin:0; padding:8px 16px 16px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row .wpforms-template .wpforms-template-favorite,
  .row .wpforms-template .wpforms-template-buttons { display:none; }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real admin-templates snapshot…</div>
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="effect-title"><b>EFFECT 011</b> · smooth R→L slide-in · real .wpforms-template cards</div>
  <div class="header"><div class="kicker">Pick a starting point</div><div class="title">Templates glide into place.</div></div>
  <div class="row" id="row"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 011 · REAL template cards adopted from snapshots/admin-templates · staggered right-to-left slide-in</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const { iframe, ready, query } = SnapshotIframe.mountSnapshot(stage, {
    slug: 'admin-templates', x: 0, y: 0, w: 1280, h: 720, scale: 1.5, zIndex: 1
  });

  ready.then(async () => {
    await SnapshotIframe.awaitDom(query, '.wpforms-template', { min: 10 });
    document.getElementById('loading').classList.add('gone');

    const cards = [...query('.wpforms-template')]
      .filter(c => c.id !== 'wpforms-template-generate' && c.id !== 'wpforms-template-blank')
      .slice(0, 7);
    cards.forEach(c => SnapshotIframe.rewriteRelativeUrls(c, 'admin-templates'));
    iframe.style.opacity = '0';

    const row = document.getElementById('row');
    cards.forEach(c => row.appendChild(c));
    const adopted = [...row.querySelectorAll('.wpforms-template')];

    const tl = gsap.timeline({ paused: true });
    tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
      .to('.effect-title', { opacity: 1, duration: 0.5 }, 0.15)
      .to('.header', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.3)
      .from('.header .title', { y: 22, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.3);

    // each real card flies in from off-stage right, sliding left into the row
    adopted.forEach((c, i) => {
      gsap.set(c, { x: 1700, opacity: 0, rotateY: -28, transformOrigin: '50% 50%' });
      const t = 0.7 + i * 0.14;
      tl.to(c, { x: 0, opacity: 1, rotateY: 0, duration: 1.05, ease: 'power3.out' }, t);
    });

    // gentle settle — a soft bob once every card has landed
    const settled = 0.7 + adopted.length * 0.14 + 1.05;
    tl.to(adopted, { y: -14, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 1,
      stagger: { each: 0.05, from: 'edges' } }, settled);
    // lift the center card
    tl.to(adopted[Math.floor(adopted.length / 2)], { y: -28, scale: 1.05, duration: 0.7, ease: 'power2.out' }, settled + 0.2);

    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  });
</script></body></html>
