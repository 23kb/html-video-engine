<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 013 — Dual rotated marquee · REAL template + addon cards</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#14110e; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }

  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#14110e; color:#aaa; font-size:14px; z-index:50; transition:opacity 0.4s; }
  .loading.gone { opacity:0; pointer-events:none; }
  .loading .spinner { width:32px; height:32px; border:3px solid #333; border-top-color:var(--wpf-orange); border-radius:50%; margin-right:12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:30; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .effect-title { position:absolute; top:24px; right:24px; padding:10px 18px; background:rgba(255,255,255,0.08); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }

  .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:64px; }
  .container { width:128%; position:relative; overflow:hidden; }
  .container.templates { height:272px; transform:rotate(-3deg); }
  .container.addons { height:200px; transform:rotate(2deg); }
  .track { display:flex; align-items:center; gap:26px; padding-left:26px; will-change:transform; }

  /* real template card — self-styled (snapshot CSS is ancestor-scoped).
     SOURCE: snapshots/admin-templates/index.html (.wpforms-template) */
  .track .wpforms-template { width:228px; height:226px; flex-shrink:0; background:#fff; border-radius:13px;
    box-shadow:0 16px 34px rgba(0,0,0,0.42); display:flex; flex-direction:column; overflow:hidden; }
  .track .wpforms-template .wpforms-template-thumbnail { height:148px; overflow:hidden; flex-shrink:0; margin:0; padding:0; border-bottom:1px solid #eee7da; }
  .track .wpforms-template .wpforms-template-thumbnail img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .track .wpforms-template .wpforms-template-name { font-size:15px; font-weight:700; color:#1d2327; margin:0; padding:14px 15px 0; line-height:1.3; }
  .track .wpforms-template .wpforms-template-desc,
  .track .wpforms-template .wpforms-template-favorite,
  .track .wpforms-template .wpforms-template-buttons { display:none; }

  /* real addon card — self-styled. SOURCE: snapshots/admin-addons/index.html (.wpforms-addons-list-item) */
  .track .wpforms-addons-list-item { width:332px; height:152px; flex-shrink:0; background:#fff;
    border:1px solid #e4e4e7; border-radius:10px; box-shadow:0 16px 34px rgba(0,0,0,0.42);
    display:flex; flex-direction:column; overflow:hidden; }
  .track .wpforms-addons-list-item-header { display:flex; gap:12px; align-items:flex-start; padding:15px 16px 8px; }
  .track .wpforms-addons-list-item-header > img { width:42px; height:42px; flex-shrink:0; object-fit:contain; border-radius:6px; }
  .track .wpforms-addons-list-item-header-meta { flex:1; min-width:0; }
  .track .wpforms-addons-list-item-header-meta-title { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:4px; }
  .track .wpforms-addons-list-item-header-meta-title a { font-size:15px; font-weight:700; color:#1d2327; text-decoration:none; }
  .track .wpforms-badge { font-size:9.5px; font-weight:600; line-height:1; padding:3px 7px; border-radius:999px; background:#eef0f2; color:#50575e; white-space:nowrap; }
  .track .wpforms-badge-blue { background:#e3effb; color:#1f6fc4; }
  .track .wpforms-badge-orange { background:#fceee1; color:#c2611f; }
  .track .wpforms-badge-purple { background:#efe7fb; color:#7340c8; }
  .track .wpforms-badge-green { background:#e2f3ea; color:#21794a; }
  .track .wpforms-addons-list-item-header-meta-excerpt { font-size:11.5px; line-height:1.5; color:#5f6368;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .track .wpforms-addons-list-item-footer { display:flex; align-items:center; gap:10px; margin-top:auto;
    padding:9px 16px; border-top:1px solid #f0f0f1; background:#fcfcfd; }
  .track .wpforms-addons-list-item-footer-settings-link { font-size:11.5px; color:#2271b1; text-decoration:none; font-weight:500; }
  .track .wpforms-addons-list-item-footer-actions { display:flex; align-items:center; margin-left:auto; }
  .track .wpforms-toggle-control { display:inline-flex; align-items:center; gap:8px; position:relative; }
  .track .wpforms-toggle-control input[type=checkbox] { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .track .wpforms-toggle-control-status { font-size:11px; color:#5f6368; }
  .track .wpforms-toggle-control-icon { display:inline-block; width:34px; height:19px; border-radius:999px; background:#c3c4c7; position:relative; }
  .track .wpforms-toggle-control-icon::after { content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.3); }
  .track .wpforms-toggle-control input:checked ~ .wpforms-toggle-control-icon { background:#2c8a55; }
  .track .wpforms-toggle-control input:checked ~ .wpforms-toggle-control-icon::after { left:17px; }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="loading" id="loading"><div class="spinner"></div>Loading real admin-templates + admin-addons snapshots…</div>
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="effect-title"><b>EFFECT 013</b> · dual rotated marquee · real template + addon cards</div>
  <div class="inner">
    <div class="container templates"><div class="track" id="tplTrack"></div></div>
    <div class="container addons"><div class="track" id="addonTrack"></div></div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 013 · REAL template + addon cards adopted from two snapshots · counter-scrolling rotated bands</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tpl = SnapshotIframe.mountSnapshot(stage, { slug:'admin-templates', x:0, y:0, w:1280, h:720, scale:1.5, zIndex:1 });
  const adn = SnapshotIframe.mountSnapshot(stage, { slug:'admin-addons',    x:0, y:0, w:1280, h:720, scale:1.5, zIndex:1 });

  Promise.all([
    tpl.ready.then(() => SnapshotIframe.awaitDom(tpl.query, '.wpforms-template', { min: 12 })),
    adn.ready.then(() => SnapshotIframe.awaitDom(adn.query, '.wpforms-addons-list-item', { min: 8 }))
  ]).then(() => {
    document.getElementById('loading').classList.add('gone');

    const tplCards = [...tpl.query('.wpforms-template')]
      .filter(c => c.id !== 'wpforms-template-generate' && c.id !== 'wpforms-template-blank')
      .slice(0, 10);
    tplCards.forEach(c => SnapshotIframe.rewriteRelativeUrls(c, 'admin-templates'));
    const addonCards = [...adn.query('.wpforms-addons-list-item')].slice(0, 8);
    addonCards.forEach(c => SnapshotIframe.rewriteRelativeUrls(c, 'admin-addons'));
    tpl.iframe.style.opacity = '0';
    adn.iframe.style.opacity = '0';

    const tplTrack = document.getElementById('tplTrack');
    tplCards.forEach(c => tplTrack.appendChild(c));
    tplCards.forEach(c => tplTrack.appendChild(c.cloneNode(true)));
    const addonTrack = document.getElementById('addonTrack');
    addonCards.forEach(c => addonTrack.appendChild(c));
    addonCards.forEach(c => addonTrack.appendChild(c.cloneNode(true)));

    requestAnimationFrame(() => {
      const cycleT = tplTrack.scrollWidth / 2;
      const cycleA = addonTrack.scrollWidth / 2;

      const tl = gsap.timeline({ paused: true });
      tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
        .to('.effect-title', { opacity: 1, duration: 0.5 }, 0.15);

      // templates band scrolls left, addons band scrolls right — counter motion
      tl.to(tplTrack, { x: `-=${cycleT}`, duration: 26, ease: 'none',
        modifiers: { x: (s) => gsap.utils.wrap(-cycleT, 0, parseFloat(s)) + 'px' } }, 0);
      tl.to(addonTrack, { x: `+=${cycleA}`, duration: 21, ease: 'none',
        modifiers: { x: (s) => gsap.utils.wrap(-cycleA, 0, parseFloat(s)) + 'px' } }, 0);
      gsap.set(addonTrack, { x: -cycleA });

      const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
      function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
      sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
      gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
      pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
      ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
    });
  });
</script></body></html>
