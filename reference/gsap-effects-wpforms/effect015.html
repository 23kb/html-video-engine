<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 015 — Duplicate-word mask reveal · REAL form</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#f3ecdb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }

  .brand { position:absolute; top:48px; left:64px; display:flex; align-items:center; gap:12px; z-index:30; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .effect-title { position:absolute; top:24px; right:24px; padding:10px 18px; background:rgba(20,17,14,0.85); color:#fff; border-radius:6px; font-size:13px; font-weight:600; z-index:30; opacity:0; }
  .effect-title b { color:var(--wpf-orange); }

  .headline { position:absolute; top:130px; left:0; right:0; text-align:center; z-index:20;
    font-size:96px; font-weight:700; letter-spacing:-0.025em; line-height:1.1; color:var(--wpf-ink); }
  .word { display:inline-block; position:relative; height:1.1em; overflow:hidden; vertical-align:bottom; }
  .word-hidden, .word-visible { display:block; line-height:1.1; }
  .word-visible { color:var(--wpf-orange); }
  .word-hidden { color:var(--wpf-ink); }

  /* REAL frontend-published-form snapshot revealed once the headline lands */
  .form-panel { position:absolute; top:362px; left:50%; transform:translateX(-50%); width:760px; height:432px;
    border-radius:16px; overflow:hidden; box-shadow:0 30px 70px rgba(20,22,28,0.22); background:#fff; opacity:0; z-index:15; }
  .form-panel iframe { position:absolute; left:0; top:0; width:1280px; height:720px; border:0;
    transform-origin:0 0; transform:scale(0.59375); pointer-events:none; }

  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="effect-title"><b>EFFECT 015</b> · duplicate-word mask reveal · real published form</div>
  <h1 class="headline" id="headline" data-text="Forms that just work."></h1>
  <div class="form-panel"><iframe id="anchor" src="../../snapshots/frontend-published-form/index.html"></iframe></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 015 · word mask-reveal headline + REAL frontend-published-form snapshot revealed</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const stage = document.getElementById('stage');
  function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // build the duplicate-word mask: each word has an ink copy + an orange copy
  const headline = document.getElementById('headline');
  const words = headline.dataset.text.split(' ');
  headline.innerHTML = '';
  words.forEach((w, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'word';
    wrap.innerHTML = `<span class="word-hidden">${w}</span><span class="word-visible">${w}</span>`;
    headline.appendChild(wrap);
    if (i < words.length - 1) headline.appendChild(document.createTextNode(' '));
  });
  const wordEls = [...headline.querySelectorAll('.word')];

  // ink copy sits in the mask; orange copy waits above, out of frame
  wordEls.forEach(w => {
    gsap.set(w.querySelector('.word-hidden'), { yPercent: 0 });
    gsap.set(w.querySelector('.word-visible'), { yPercent: -100 });
  });

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.inOut' } });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);
  tl.to('.effect-title', { opacity: 1, duration: 0.5 }, 0.2);

  // each word: ink slides down out of the mask, orange slides down into it
  let last = 0.5;
  wordEls.forEach((w, i) => {
    const t = 0.6 + i * 0.2;
    tl.to(w.querySelector('.word-hidden'),  { yPercent: 100, duration: 0.7 }, t);
    tl.to(w.querySelector('.word-visible'), { yPercent: 0,   duration: 0.7 }, t);
    last = t + 0.7;
  });

  // the real published form rises into view once the headline has resolved
  tl.to('.form-panel', { opacity: 1, duration: 0.9, ease: 'power3.out' }, last - 0.1);
  tl.from('.form-panel', { y: 40, duration: 0.9, ease: 'power3.out' }, last - 0.1);

  // pulse the real submit button inside the form once it is loaded
  const anchor = document.getElementById('anchor');
  anchor.addEventListener('load', () => {
    try {
      const doc = anchor.contentDocument;
      const submit = doc && doc.querySelector('.wpforms-submit, button[type="submit"]');
      if (submit) {
        const at = Math.max(tl.duration() - 0.5, last + 0.6);
        tl.to(submit, { scale: 1.05, duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: 1, transformOrigin: 'center center' }, at);
      }
    } catch (_) { /* cross-origin guard */ }
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
