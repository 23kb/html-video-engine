<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script src="_snapshot-iframe.js"></script>
<script>
  const EFFECT = {"id":91,"short":"3D wheel gallery","mode":"cylinder","source":"template","count":16,"cardW":220,"cardH":220,"originalTitle":"Effect 091 — 3D wheel gallery (WPForms port)","theme":"dark","headline":"3D wheel gallery","sub":"Real template cards wrap around a wheel."};

  const stage = document.getElementById('stage');
  const cardsLayer = document.getElementById('cards');
  const ghost = document.getElementById('ghost');
  const loading = document.getElementById('loading');

  function fit(){
    const scale = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080) * 0.96;
    stage.style.transform = 'scale(' + scale + ')';
  }
  addEventListener('resize', fit); fit();

  function rng(seed){
    let a = seed || 1;
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function wrap(min, max, value){
    const range = max - min;
    return ((((value - min) % range) + range) % range) + min;
  }
  function setCardSize(cards, w, h){
    stage.style.setProperty('--card-w', (w || 260) + 'px');
    stage.style.setProperty('--card-h', (h || 240) + 'px');
    cards.forEach(function(card){
      card.style.marginLeft = (-(w || 260) / 2) + 'px';
      card.style.marginTop = (-(h || 240) / 2) + 'px';
    });
  }
  function posGrid(cards, cols, gapX, gapY, topShift){
    const rows = Math.ceil(cards.length / cols);
    const out = [];
    cards.forEach(function(card, i){
      const c = i % cols;
      const r = Math.floor(i / cols);
      out.push({
        x: (c - (cols - 1) / 2) * gapX,
        y: (r - (rows - 1) / 2) * gapY + (topShift || 0)
      });
    });
    return out;
  }
  function setGhost(x, y){ gsap.set(ghost, { x:x, y:y }); }
  function moveGhost(tl, points, start, dur, ease){
    const state = { x: points[0].x, y: points[0].y };
    setGhost(state.x, state.y);
    points.slice(1).forEach(function(p, i){
      tl.to(state, { x:p.x, y:p.y, duration:dur || 1.4, ease:ease || 'power2.inOut',
        onUpdate:function(){ setGhost(state.x, state.y); } }, (start || 0.5) + i * (dur || 1.4));
    });
    return state;
  }
  function textSpans(text, byChar){
    const line = document.createElement('div');
    line.className = 'word-line' + (EFFECT.smallText ? ' small' : '');
    if (byChar) {
      text.split('').forEach(function(ch){
        const s = document.createElement('span');
        s.className = 'ch' + (EFFECT.accent && EFFECT.accent.indexOf(ch) >= 0 ? ' accent' : '');
        s.textContent = ch === ' ' ? '\u00a0' : ch;
        line.appendChild(s);
      });
    } else {
      text.split(' ').forEach(function(word, i){
        const s = document.createElement('span');
        s.className = 'w' + (EFFECT.accentWords && EFFECT.accentWords.some(function(k){ return word.toLowerCase().indexOf(k.toLowerCase()) >= 0; }) ? ' accent' : '');
        s.textContent = word + (i === text.split(' ').length - 1 ? '' : ' ');
        line.appendChild(s);
      });
    }
    document.getElementById('words').appendChild(line);
    return line;
  }
  function addProgress(n){
    const p = document.createElement('div');
    p.className = 'progress';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      if (i === 0) s.className = 'active';
      p.appendChild(s);
    }
    stage.appendChild(p);
    return Array.from(p.children);
  }
  async function adoptCards(){
    const source = EFFECT.source === 'addons'
      ? { slug:'admin-addons', selector:'.wpforms-addons-list-item', min:Math.min(EFFECT.count, 20) }
      : { slug:'admin-templates', selector:'.wpforms-template', min:Math.min(EFFECT.count + 2, 24) };
    const mount = SnapshotIframe.mountSnapshot(stage, {
      slug:source.slug, x:0, y:0, w:1280, h:720, scale:1.5, zIndex:1
    });
    await mount.ready;
    await SnapshotIframe.awaitDom(mount.query, source.selector, { min: source.min, timeoutMs: 8000 });
    let nodes = Array.from(mount.query(source.selector));
    if (source.slug === 'admin-templates') {
      nodes = nodes.filter(function(node){
        return node.id !== 'wpforms-template-generate' && node.id !== 'wpforms-template-blank';
      });
    }
    nodes = nodes.slice(EFFECT.offset || 0, (EFFECT.offset || 0) + EFFECT.count);
    nodes.forEach(function(node, i){
      // SOURCE: snapshots/admin-templates/index.html (.wpforms-template) or snapshots/admin-addons/index.html (.wpforms-addons-list-item)
      SnapshotIframe.rewriteRelativeUrls(node, source.slug);
      node.classList.add('motion-card');
      node.dataset.realSnapshot = source.slug;
      node.dataset.motionIndex = String(i);
      cardsLayer.appendChild(node);
    });
    mount.iframe.style.opacity = '0';
    setCardSize(nodes, EFFECT.cardW, EFFECT.cardH);
    return nodes;
  }
  function intro(tl){
    tl.to('.brand', { opacity:1, duration:0.45, ease:'power2.out' }, 0.1);
    tl.to('.effect-title', { opacity:1, duration:0.45, ease:'power2.out' }, 0.15);
    tl.to('.headline', { opacity:1, duration:0.55, ease:'power2.out' }, 0.25);
    tl.to('.subhead', { opacity:1, duration:0.55, ease:'power2.out' }, 0.38);
  }
  function modeSpiral(cards, tl){
    intro(tl);
    tl.to('.center-hub', { opacity:1, scale:1, duration:0.8, ease:'back.out(1.5)' }, 0.35);
    tl.from('.center-hub', { scale:0.35, duration:0.8, ease:'back.out(1.5)' }, 0.35);
    cards.forEach(function(card, i){
      const state = { angle:i * (360 / cards.length), radius:EFFECT.variant === 'magnetic' ? 1000 : 1400 };
      const endRadius = EFFECT.variant === 'bloom' ? 300 + i * 5 : 235 + i * 7;
      const turns = EFFECT.variant === 'sphere' ? 720 : 540;
      const start = 0.7 + i * 0.035;
      gsap.set(card, { x:Math.cos(state.angle * Math.PI / 180) * state.radius, y:Math.sin(state.angle * Math.PI / 180) * state.radius, rotation:state.angle + 90, scale:0.46, opacity:0 });
      tl.to(card, { opacity:1, scale:EFFECT.variant === 'sphere' ? 0.72 : 1, duration:0.45, ease:'power2.out' }, start);
      tl.to(state, { angle:state.angle + turns, radius:endRadius, duration:4.2, ease:EFFECT.variant === 'magnetic' ? 'elastic.out(1,0.55)' : 'power2.inOut',
        onUpdate:function(){
          const r = state.angle * Math.PI / 180;
          gsap.set(card, { x:Math.cos(r) * state.radius, y:Math.sin(r) * state.radius, rotation:state.angle + 90 });
        } }, start);
    });
  }
  function modeGridCursor(cards, tl){
    intro(tl);
    tl.to('.ghost', { opacity:1, duration:0.35 }, 0.25);
    const cols = EFFECT.cols || 6;
    const positions = posGrid(cards, cols, EFFECT.gapX || 300, EFFECT.gapY || 220, EFFECT.gridY || 60);
    cards.forEach(function(card, i){ gsap.set(card, { x:positions[i].x, y:positions[i].y, scale:0.95, opacity:1 }); });
    const cursor = moveGhost(tl, [{x:300,y:300},{x:1600,y:280},{x:1600,y:800},{x:300,y:800},{x:960,y:540},{x:1700,y:540},{x:220,y:540}], 0.65, 1.25, 'sine.inOut');
    gsap.ticker.add(function(){
      if (tl.paused() && tl.time() === 0) return;
      cards.forEach(function(card, i){
        const p = positions[i];
        const dx = cursor.x - (960 + p.x);
        const dy = cursor.y - (540 + p.y);
        const d = Math.hypot(dx, dy);
        const near = clamp(1 - d / 640, 0, 1);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        const scale = EFFECT.mode === 'proximityGrid' ? 0.82 + near * 0.48 : 0.95 + near * 0.12;
        gsap.set(card, { rotation:angle * near * 0.16, scale:scale, z:near * 80 });
      });
    });
  }
  function modeRiseBounce(cards, tl){
    intro(tl);
    cards.forEach(function(card, i){ gsap.set(card, { x:(i - (cards.length - 1) / 2) * 12, y:820, opacity:0, rotation:(i - 3) * 2 }); });
    cards.forEach(function(card, i){
      const t = 0.82 + i * 0.72;
      tl.to(card, { y:20, x:(i - (cards.length - 1) / 2) * 4, opacity:1, rotation:0, duration:0.65, ease:'back.out(1.35)' }, t);
      tl.to(card, { y:20, duration:0.46 }, t + 0.65);
      if (i < cards.length - 1) tl.to(card, { y:-950, opacity:0, duration:0.7, ease:'back.in(1.5)' }, t + 1.1);
    });
  }
  function modeCarousel(cards, tl){
    intro(tl);
    const gap = EFFECT.gapX || 330;
    const cycle = gap * cards.length;
    cards.forEach(function(card, i){ gsap.set(card, { x:-860 + i * gap, y:EFFECT.rowY || 70, opacity:1, scale:1 }); });
    const state = { x:0 };
    function render(){
      cards.forEach(function(card, i){
        const x = wrap(-980, cycle - 980, -860 + i * gap + state.x);
        gsap.set(card, { x:x, y:EFFECT.rowY || 70 });
      });
    }
    tl.to(state, { x:-cycle, duration:EFFECT.long ? 15 : 9, ease:EFFECT.ease || 'power3.inOut', onUpdate:render }, 0.6);
    [0.7, 3.5, 6.2].forEach(function(t){
      tl.to(cards, { scaleX:EFFECT.variant === 'squash' ? 1.36 : 1.22, scaleY:EFFECT.variant === 'squash' ? 0.82 : 0.92, duration:0.7, ease:'power2.out', stagger:0.01 }, t);
      tl.to(cards, { scaleX:1, scaleY:1, duration:1.0, ease:'elastic.out(1,0.55)', stagger:0.01 }, t + 0.7);
    });
  }
  function modeTrail(cards, tl){
    intro(tl);
    tl.to('.ghost', { opacity:1, duration:0.35 }, 0.25);
    const cursor = moveGhost(tl, [{x:300,y:540},{x:1600,y:300},{x:1700,y:800},{x:300,y:800},{x:960,y:220},{x:1520,y:540}], 0.55, 1.35, 'power2.inOut');
    const rand = rng(EFFECT.id);
    cards.forEach(function(card, i){
      const pos = { x:960, y:540 };
      const offX = EFFECT.mode === 'bubbleTrail' ? (rand() - 0.5) * 160 : 0;
      const offY = EFFECT.mode === 'bubbleTrail' ? (rand() - 0.5) * 130 : 0;
      const damping = (EFFECT.mode === 'bubbleTrail' ? 0.09 + rand() * 0.07 : 0.16 - i * 0.012);
      gsap.set(card, { opacity:1, scale:Math.max(0.45, 1 - i * 0.055), zIndex:cards.length - i });
      gsap.ticker.add(function(){
        if (tl.paused() && tl.time() === 0) return;
        pos.x += (cursor.x + offX - pos.x) * damping;
        pos.y += (cursor.y + offY - pos.y) * damping;
        gsap.set(card, { x:pos.x - 960, y:pos.y - 540, rotation:(i - cards.length / 2) * (EFFECT.mode === 'bubbleTrail' ? 2.2 : 0.6) });
      });
    });
  }
  function modeText(cards, tl){
    intro(tl);
    const text = EFFECT.text || 'Build forms faster';
    const byChar = EFFECT.textKind !== 'words';
    const line = textSpans(text, byChar);
    const bits = Array.from(line.querySelectorAll(byChar ? '.ch' : '.w'));

  function modeInchworm(cards, tl){
    intro(tl);
    cards.forEach(function(card, i){ gsap.set(card, { x:760 + i * 230, y:100, opacity:1, scale:0.78 }); });
    cards.forEach(function(card, i){
      const t = 0.7 + i * 0.16;
      tl.to(card, { x:'-=1420', y:-60, duration:1.0, ease:'power2.out' }, t);
      tl.to(card, { y:100, duration:0.75, ease:'bounce.out' }, t + 0.55);
    });
  }
  function modeTimeline(cards, tl){
    intro(tl);
    const dates = ['2020','2021','2022','2023','2024','2025'];
    dates.forEach(function(y, i){
      const d = document.createElement('div');
      d.className = 'word-line';
      d.style.top = (250 + i * 90) + 'px';
      d.style.fontSize = '86px';
      d.style.textAlign = i % 2 ? 'right' : 'left';
      d.style.opacity = '0.18';
      d.textContent = y;
      document.getElementById('words').appendChild(d);
      tl.from(d, { x:i % 2 ? 240 : -240, opacity:0, duration:0.8, ease:'power3.out' }, 0.75 + i * 0.35);
    });
    cards.forEach(function(card, i){ gsap.set(card, { x:(i % 2 ? 1 : -1) * 520, y:-320 + i * 130, opacity:1, scale:0.7 }); });
    tl.to(cards, { y:'+=420', duration:6.5, stagger:0.04, ease:'none' }, 0.75);
  }
  function modeFlight(cards, tl){
    intro(tl);
    const rand = rng(EFFECT.id);
    cards.forEach(function(card, i){
      const side = EFFECT.variant === 'suction' ? 1 : (i % 2 ? 1 : -1);
      gsap.set(card, { x:side * (1050 + rand() * 360), y:(rand() - 0.5) * 650, rotation:(rand() - 0.5) * 40, scale:0.75, opacity:0 });
      const t = 0.75 + i * 0.18;
      tl.to(card, { x:(i - (cards.length - 1) / 2) * 160, y:120 + (i % 2) * 40, rotation:0, scale:0.78, opacity:1, duration:1.15, ease:EFFECT.variant === 'magnetic' ? 'elastic.out(1,0.55)' : 'power3.inOut' }, t);
      if (EFFECT.variant === 'suction') tl.to(card, { y:-650, scale:0.18, opacity:0, duration:0.8, ease:'back.in(1.6)' }, t + 1.25);
    });
  }
  function modeTighten(cards, tl){
    intro(tl);
    cards.forEach(function(card, i){ gsap.set(card, { x:(i - (cards.length - 1) / 2) * 310, y:100, opacity:1, scale:0.78 }); });
    tl.to(cards, { x:function(i){ return (i - (cards.length - 1) / 2) * 190; }, duration:4.5, ease:'power3.inOut', stagger:0.02 }, 0.8);
  }
  function runMode(cards, tl){
    const m = EFFECT.mode;
    if (m === 'spiral') return modeSpiral(cards, tl);
    if (m === 'gridCursor' || m === 'proximityGrid') return modeGridCursor(cards, tl);
    if (m === 'riseBounce') return modeRiseBounce(cards, tl);
    if (m === 'carousel') return modeCarousel(cards, tl);
    if (m === 'trail' || m === 'bubbleTrail') return modeTrail(cards, tl);
    if (m === 'text') return modeText(cards, tl);
    if (m === 'orbit') return modeOrbit(cards, tl);
    if (m === 'marquee') return modeMarquee(cards, tl);
    if (m === 'randomFocus') return modeRandomFocus(cards, tl);
    if (m === 'gridDrift') return modeGridDrift(cards, tl);
    if (m === 'listPreview') return modeListPreview(cards, tl);
    if (m === 'slides3d') return modeSlides3d(cards, tl);
    if (m === 'rowExpand') return modeRowExpand(cards, tl);
    if (m === 'shuffleBurst') return modeShuffleBurst(cards, tl);
    if (m === 'maskSweep') return modeMaskSweep(cards, tl);
    if (m === 'flipbook') return modeFlipbook(cards, tl);
    if (m === 'tilt' || m === 'depthParallax') return modeTilt(cards, tl);
    if (m === 'rings') return modeRings(cards, tl);
    if (m === 'zStack') return modeZStack(cards, tl);
    if (m === 'fan') return modeFan(cards, tl);
    if (m === 'stair') return modeStair(cards, tl);
    if (m === 'zoom') return modeZoom(cards, tl);
    if (m === 'vertical') return modeVertical(cards, tl);
    if (m === 'cylinder') return modeCylinder(cards, tl);
    if (m === 'elasticRail') return modeElasticRail(cards, tl);
    if (m === 'splitBurst') return modeSplitBurst(cards, tl);
    if (m === 'particle') return modeParticle(cards, tl);
    if (m === 'reorder') return modeReorder(cards, tl);
    if (m === 'phyllotaxis') return modePhyllotaxis(cards, tl);
    if (m === 'inchworm') return modeInchworm(cards, tl);
    if (m === 'timeline') return modeTimeline(cards, tl);
    if (m === 'flight') return modeFlight(cards, tl);
    if (m === 'tighten') return modeTighten(cards, tl);
    return modeMarquee(cards, tl);
  }
  function setupControls(tl){
    const sc = document.getElementById('scrub');
    const te = document.getElementById('time');
    const pb = document.getElementById('playBtn');
    function ut(){ te.textContent = tl.time().toFixed(2).padStart(5,'0') + ' / ' + tl.duration().toFixed(2).padStart(5,'0'); }
    sc.addEventListener('input', function(){ tl.pause(); pb.textContent = 'Play'; tl.progress(parseFloat(sc.value) / 100); ut(); });
    gsap.ticker.add(function(){ if (!tl.paused()) { sc.value = (tl.progress() * 100).toFixed(2); ut(); if (tl.progress() >= 1) pb.textContent = 'Replay'; } });
    pb.addEventListener('click', function(){
      if (tl.progress() >= 1) { tl.restart(); pb.textContent = 'Pause'; }
      else if (tl.paused()) { tl.play(); pb.textContent = 'Pause'; }
      else { tl.pause(); pb.textContent = 'Play'; }
    });
    ut();
    setTimeout(function(){ tl.play(); pb.textContent = 'Pause'; }, 400);
  }
  adoptCards().then(function(cards){
    loading.classList.add('gone');
    const tl = gsap.timeline({ paused:true });
    runMode(cards, tl);
    window.__wpformsEffect = { timeline:tl, cards:cards, effect:EFFECT };
    setupControls(tl);
  }).catch(function(err){
    console.error(err);
    loading.textContent = 'Failed: ' + err.message;
  });

</script></body></html>
