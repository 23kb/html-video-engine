<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 002 — Cursor-distance image cycle (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#14110e; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .card { position:absolute; top:50%; left:50%; width:560px; height:700px; margin:-350px 0 0 -280px; border-radius:20px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .medias { position:absolute; inset:0; }
  .media { position:absolute; inset:0; background:white; padding:40px; display:flex; flex-direction:column; gap:18px; opacity:0; }
  .media.active { opacity:1; }
  .media .badge { font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; padding:5px 14px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:36px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; line-height:1.1; }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:14px 18px; font-size:16px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:16px; font-weight:700; font-size:17px; }
  .media[data-c="blue"]   .badge,.media[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"]  .badge,.media[data-c="green"]  .submit { background:#2c8a55; }
  .media[data-c="amber"]  .badge,.media[data-c="amber"]  .submit { background:#d59324; }
  .media[data-c="pink"]   .badge,.media[data-c="pink"]   .submit { background:#c93874; }
  .ghost { position:absolute; width:30px; height:30px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 24px rgba(226,119,48,0.7); pointer-events:none; z-index:20; transform:translate(-50%,-50%); opacity:0; }
  .label { position:absolute; bottom:80px; left:0; right:0; text-align:center; color:rgba(250,246,238,0.5); font-size:14px; letter-spacing:0.20em; text-transform:uppercase; opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="card"><div class="medias" id="medias"></div></div>
  <div class="ghost" id="ghost"></div>
  <div class="label">Move further · see more forms</div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 002 · cursor-distance image cycle</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items = [{k:'Contact',c:'orange',t:'Tell us about your project'},{k:'Payment',c:'blue',t:'Stripe Checkout'},{k:'AI',c:'purple',t:'Generate by prompt'},{k:'Survey',c:'green',t:'NPS Feedback'},{k:'Order',c:'amber',t:'Place your order'},{k:'Event',c:'pink',t:'RSVP — Summit 2026'}];
  const medias = document.getElementById('medias');
  items.forEach((it,i)=>{const el=document.createElement('div');el.className='media'+(i===0?' active':'');el.dataset.c=it.c;el.innerHTML=`<div class="badge">${it.k}</div><div class="ttl">${it.t}</div><div class="field">Field</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div>`;medias.appendChild(el);});
  const mediaEls=gsap.utils.toArray('.media');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.label',{opacity:1,duration:0.5},0.3);
  tl.to('.ghost',{opacity:1,duration:0.4},0.3);

  // ghost cursor traces a long path. Total cursor-travel distance determines which image is shown.
  // Image swaps occur every N units of cumulative travel.
  const waypoints=[{x:600,y:540},{x:1400,y:540},{x:1400,y:200},{x:500,y:200},{x:500,y:800},{x:1500,y:800},{x:960,y:540}];
  const ghost=document.getElementById('ghost');
  const cs={x:waypoints[0].x,y:waypoints[0].y};
  gsap.set(ghost,{x:cs.x,y:cs.y});

  let last=waypoints[0],cursor=0.5;
  for(let i=1;i<waypoints.length;i++){
    const w=waypoints[i];
    const dur=1.2;
    tl.to(cs,{x:w.x,y:w.y,duration:dur,ease:'power2.inOut',onUpdate:()=>gsap.set(ghost,{x:cs.x,y:cs.y})},cursor);
    cursor+=dur;
  }

  // swap images at intervals matching the "cursor distance" idea
  const total=cursor-0.5;
  mediaEls.forEach((m,i)=>{
    if(i===0)return;
    const t=0.5+(total/mediaEls.length)*i;
    tl.to(mediaEls[i-1],{opacity:0,duration:0.4,ease:'power2.in'},t);
    tl.to(m,{opacity:1,duration:0.4,ease:'power2.out'},t);
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
