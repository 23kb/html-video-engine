<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 006 — Paragraph word-swap (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(135deg,#fdfaf3 0%,#f1e8d4 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .pin-height { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .slot { position:relative; width:1500px; height:300px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .paragraph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:18px 24px; font-size:62px; font-weight:600; letter-spacing:-0.015em; line-height:1.1; color:var(--wpf-ink); text-align:center; padding:0 60px; opacity:0; }
  .paragraph.accent .word.k { color:var(--wpf-orange); }
  .word { display:inline-block; opacity:0; will-change:transform,opacity; }
  .rule { position:absolute; left:50%; bottom:-20px; width:0; height:4px; background:var(--wpf-orange); transform:translateX(-50%); border-radius:2px; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; font-family:inherit; }
  .controls button:hover { background:var(--wpf-orange-hover); }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="pin-height"><div class="slot" id="slot">
    <p class="paragraph" data-words="Build the form. — Capture the lead. — Watch it grow."></p>
    <p class="paragraph" data-words="No code. — No headaches. — Just signups."></p>
    <p class="paragraph accent" data-words="That's the WPForms way."></p>
    <div class="rule"></div>
  </div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 006 · paragraph word-swap</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  // split each paragraph's data-words into per-word spans (— delimited keeps line breaks)
  const paragraphs = [...document.querySelectorAll('.paragraph')];
  paragraphs.forEach((p) => {
    const txt = p.dataset.words;
    p.innerHTML = '';
    txt.split(' ').forEach((w) => {
      const s = document.createElement('span');
      s.className = 'word' + (/^(WPForms|the|lead|grow|signups|way)\.?$/.test(w.replace(/[.,—]/g,'')) ? ' k' : '');
      s.textContent = w + ' ';
      p.appendChild(s);
    });
  });

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  const HOLD = 1.1, REVEAL = 0.5, EXIT = 0.45, STAG = 0.04, OVERLAP = 0.3;
  let cursor = 0.6;

  paragraphs.forEach((p, i) => {
    const words = p.querySelectorAll('.word');
    gsap.set(p, { opacity: 1 });   // container always visible; words handle opacity
    gsap.set(words, { y: 30, opacity: 0 });

    const start = cursor;
    tl.to(words, { y: 0, opacity: 1, duration: REVEAL, stagger: STAG, ease: 'power3.out' }, start);
    if (i === 0) tl.fromTo('.rule', { width: 0 }, { width: 380, duration: REVEAL*0.9 }, start + 0.1);

    const inEnd = start + REVEAL + (words.length - 1) * STAG;
    const holdEnd = inEnd + HOLD;
    const isLast = (i === paragraphs.length - 1);
    if (!isLast) {
      tl.to(words, { y: -30, opacity: 0, duration: EXIT, stagger: STAG, ease: 'power3.in' }, holdEnd);
      cursor = holdEnd + EXIT - OVERLAP;
    } else {
      tl.to('.rule', { width: 540, duration: 0.6 }, holdEnd);
    }
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
