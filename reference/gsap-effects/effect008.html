<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 008 — Drag list with subtle random (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .header { position:absolute; top:90px; left:0; right:0; text-align:center; opacity:0; z-index:5; }
  .header .kicker { color:var(--wpf-orange); font-size:13px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:10px; }
  .header .title { font-size:50px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }
  .container { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); height:340px; overflow:hidden; }
  .strip { position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; gap:30px; will-change:transform; padding-left:20px; }
  .card { width:260px; height:320px; background:white; border-radius:16px; flex-shrink:0; box-shadow:0 14px 32px rgba(20,22,28,0.18),0 4px 10px rgba(20,22,28,0.06); padding:18px; display:flex; flex-direction:column; gap:8px; will-change:transform; }
  .card .badge { font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .card .ttl { font-size:18px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.005em; }
  .card .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:6px; padding:8px 10px; font-size:11px; color:var(--wpf-ink-mute); }
  .card .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:6px; text-align:center; padding:8px; font-weight:700; font-size:11px; }
  .card[data-c="blue"]   .badge,.card[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .card[data-c="purple"] .badge,.card[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .card[data-c="green"]  .badge,.card[data-c="green"]  .submit { background:#2c8a55; }
  .card[data-c="amber"]  .badge,.card[data-c="amber"]  .submit { background:#d59324; }
  .card[data-c="teal"]   .badge,.card[data-c="teal"]   .submit { background:#2a8a8e; }
  .card[data-c="pink"]   .badge,.card[data-c="pink"]   .submit { background:#c93874; }
  .footer-cap { position:absolute; bottom:130px; left:0; right:0; text-align:center; color:var(--wpf-ink-mute); font-size:18px; opacity:0; z-index:5; }
  .footer-cap strong { color:var(--wpf-ink); font-weight:700; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="header"><div class="kicker">Browse</div><div class="title">Drag through templates.</div></div>
  <div class="container"><div class="strip" id="strip"></div></div>
  <div class="footer-cap"><strong>Always alive</strong> · cards jitter as they drift</div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 008 · drag-list with subtle random jitter</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng = mulberry32(8);
  const items = [
    { k:'Contact',  c:'orange', t:'Quick Contact',  b:'Send' },
    { k:'Payment',  c:'blue',   t:'Stripe Checkout',b:'Pay' },
    { k:'AI',       c:'purple', t:'AI Generator',   b:'Generate' },
    { k:'Survey',   c:'green',  t:'NPS Feedback',   b:'Submit' },
    { k:'Order',    c:'amber',  t:'Product Order',  b:'Buy' },
    { k:'Booking',  c:'teal',   t:'Reserve Slot',   b:'Book' },
    { k:'Lead',     c:'pink',   t:'Lead Magnet',    b:'Get it' },
    { k:'Event',    c:'orange', t:'Event RSVP',     b:'RSVP' },
  ];
  const strip = document.getElementById('strip');
  const all = [...items, ...items];
  all.forEach((it) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.c = it.c;
    el.innerHTML = `<div class="badge">${it.k}</div><div class="ttl">${it.t}</div><div class="field">Field</div><div class="field">Field</div><div class="submit">${it.b}</div>`;
    strip.appendChild(el);
  });
  const cards = gsap.utils.toArray('.card');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  requestAnimationFrame(() => {
    const cycle = strip.scrollWidth / 2;
    const tl = gsap.timeline({ paused: true });
    tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
      .to('.header', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.25);

    // continuous L drift
    tl.to(strip, {
      x: `-=${cycle}`, duration: 16, ease: 'none',
      modifiers: { x: (xStr) => gsap.utils.wrap(-cycle, 0, parseFloat(xStr)) + 'px' }
    }, 0);

    // each card has its own subtle random jitter loop (the source's "subtle random movement during drag")
    cards.forEach((card) => {
      const dx = (rng() - 0.5) * 12, dy = (rng() - 0.5) * 8, rot = (rng()-0.5)*3;
      const dur = 1.8 + rng() * 1.2;
      tl.to(card, { x: dx, y: dy, rotate: rot, duration: dur, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    });

    tl.to('.footer-cap', { opacity: 1, duration: 0.7 }, 1.6);

    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  });
</script></body></html>
