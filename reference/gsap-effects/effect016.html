<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 016 — Swirling spiral images (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#1f1810 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .center-pin { position:absolute; top:50%; left:50%; width:200px; height:200px; margin:-100px 0 0 -100px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ff8d3f,var(--wpf-orange) 60%,#b35a1f); box-shadow:0 0 80px rgba(226,119,48,0.5); display:flex; align-items:center; justify-content:center; z-index:5; opacity:0; }
  .center-pin .lbl { color:white; font-weight:800; font-size:20px; }
  .container { position:absolute; inset:0; }
  .media-wrapper { position:absolute; top:50%; left:50%; transform-origin:center; will-change:transform,opacity; opacity:0; }
  .media { width:180px; height:230px; margin:-115px 0 0 -90px; background:white; border-radius:14px; box-shadow:0 16px 36px rgba(0,0,0,0.5); padding:12px; display:flex; flex-direction:column; gap:6px; }
  .media .badge { font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:12px; font-weight:700; color:var(--wpf-ink); }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:4px; padding:3px 5px; font-size:8px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:4px; text-align:center; padding:4px; font-weight:700; font-size:9px; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container" id="container"></div>
  <div class="center-pin"><div class="lbl">WPForms</div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 016 · swirling spiral images</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const container=document.getElementById('container');
  const N=16;
  const labels=['Contact','Payment','AI','Survey','Order','Booking','Lead','Event','Donate','Login','Feedback','Waitlist','Quote','Refund','Poll','RSVP'];
  for(let i=0;i<N;i++){
    const el=document.createElement('div');
    el.className='media-wrapper';
    el.dataset.i=i;
    el.innerHTML=`<div class="media"><div class="badge">${labels[i]}</div><div class="ttl">${labels[i]}</div><div class="field">F</div><div class="field">F</div><div class="submit">→</div></div>`;
    container.appendChild(el);
  }
  const mw=gsap.utils.toArray('.media-wrapper');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // each wrapper starts FAR from center on a spiral path. As time advances, it spirals inward.
  // start: angle = i*45°, radius=1400; end: angle = i*45° + 540° (1.5 turns inward), radius=140
  const startStates=mw.map((_,i)=>({
    angle:i*(360/N),radius:1400,opacity:0
  }));
  startStates.forEach((s,i)=>{
    const r=s.angle*Math.PI/180;
    gsap.set(mw[i],{x:Math.cos(r)*s.radius,y:Math.sin(r)*s.radius,rotation:s.angle+90,opacity:0,scale:0.5});
  });

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.center-pin',{opacity:1,scale:1,duration:0.8,ease:'back.out(1.6)'},0.3);
  tl.from('.center-pin',{scale:0.4,duration:0.8,ease:'back.out(1.6)'},0.3);

  // animate each wrapper inward along spiral
  mw.forEach((el,i)=>{
    const state={angle:i*(360/N),radius:1400};
    const endAngle=state.angle+540;
    const endRadius=240+i*8;
    tl.to(el,{opacity:1,scale:1,duration:0.5,ease:'power2.out'},0.6+i*0.04);
    tl.to(state,{
      angle:endAngle,radius:endRadius,duration:4.0,ease:'power2.inOut',
      onUpdate:()=>{const r=state.angle*Math.PI/180; gsap.set(el,{x:Math.cos(r)*state.radius,y:Math.sin(r)*state.radius,rotation:state.angle+90});}
    },0.6+i*0.04);
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
