<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 019 — Scaled deform carousel (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); height:460px; overflow:hidden; }
  .content { position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; gap:40px; padding-left:20px; will-change:transform; }
  .media { width:280px; height:380px; background:white; border-radius:18px; box-shadow:0 18px 40px rgba(20,22,28,0.18); flex-shrink:0; padding:18px; display:flex; flex-direction:column; gap:10px; will-change:transform; transform-origin:center; }
  .media .badge { font-size:11px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:18px; font-weight:700; color:var(--wpf-ink); }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:6px; padding:8px 10px; font-size:12px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:6px; text-align:center; padding:8px; font-weight:700; font-size:12px; }
  .media[data-c="blue"]   .badge,.media[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"]  .badge,.media[data-c="green"]  .submit { background:#2c8a55; }
  .media[data-c="amber"]  .badge,.media[data-c="amber"]  .submit { background:#d59324; }
  .media[data-c="teal"]   .badge,.media[data-c="teal"]   .submit { background:#2a8a8e; }
  .media[data-c="pink"]   .badge,.media[data-c="pink"]   .submit { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container"><div class="content" id="content"></div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 019 · scaled deform infinite scroll</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange'},{k:'Payment',c:'blue'},{k:'AI',c:'purple'},{k:'Survey',c:'green'},{k:'Order',c:'amber'},{k:'Booking',c:'teal'},{k:'Lead',c:'pink'},{k:'Event',c:'orange'},{k:'Donate',c:'green'}];
  const content=document.getElementById('content');
  [...items,...items].forEach((it)=>{
    const el=document.createElement('div');
    el.className='media';el.dataset.c=it.c;
    el.innerHTML=`<div class="badge">${it.k}</div><div class="ttl">${it.k} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div>`;
    content.appendChild(el);
  });
  const cards=gsap.utils.toArray('.media');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  requestAnimationFrame(()=>{
    const cycle=content.scrollWidth/2;
    const tl=gsap.timeline({paused:true});
    tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);

    // BURSTS of acceleration cause scale deformation on cards
    const dist=cycle;
    const burstDur=4;
    const state={v:0};

    // continuous drift
    tl.to(content,{x:`-=${dist}`,duration:burstDur*2,ease:'power3.inOut',modifiers:{x:(s)=>gsap.utils.wrap(-cycle,0,parseFloat(s))+'px'}},0.5);

    // scale deform synced to velocity. We approximate via timeline-based card scale tween
    tl.to(cards,{scaleX:1.4,scaleY:0.85,duration:1.0,ease:'power2.out'},0.5);
    tl.to(cards,{scaleX:1,scaleY:1,duration:1.5,ease:'elastic.out(1,0.5)'},2);
    tl.to(cards,{scaleX:1.4,scaleY:0.85,duration:1.0,ease:'power2.out'},4);
    tl.to(cards,{scaleX:1,scaleY:1,duration:1.5,ease:'elastic.out(1,0.5)'},5.5);
    tl.to(cards,{scaleX:1.4,scaleY:0.85,duration:1.0,ease:'power2.out'},7);
    tl.to(cards,{scaleX:1,scaleY:1,duration:1.5,ease:'elastic.out(1,0.5)'},8.5);

    const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
    function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
    sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
    gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
    pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
    ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
  });
</script></body></html>
