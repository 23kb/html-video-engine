<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 021 — Bubbly mouse trail (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#1f1810 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .medias { position:absolute; inset:0; }
  .bubble { position:absolute; width:160px; height:200px; margin:-100px 0 0 -80px; background:white; border-radius:14px; box-shadow:0 14px 32px rgba(0,0,0,0.4); padding:12px; display:flex; flex-direction:column; gap:6px; transform-origin:center; will-change:transform; opacity:0; }
  .bubble .badge { font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .bubble .ttl { font-size:12px; font-weight:700; color:var(--wpf-ink); }
  .bubble .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:4px; text-align:center; padding:4px; font-weight:700; font-size:9px; }
  .bubble[data-c="blue"]   .badge,.bubble[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .bubble[data-c="purple"] .badge,.bubble[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .bubble[data-c="green"]  .badge,.bubble[data-c="green"]  .submit { background:#2c8a55; }
  .bubble[data-c="amber"]  .badge,.bubble[data-c="amber"]  .submit { background:#d59324; }
  .bubble[data-c="pink"]   .badge,.bubble[data-c="pink"]   .submit { background:#c93874; }
  .ghost { position:absolute; width:30px; height:30px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 24px rgba(226,119,48,0.7); pointer-events:none; z-index:20; transform:translate(-50%,-50%); opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="medias" id="medias"></div>
  <div class="ghost" id="ghost"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 021 · bubbly mouse trail with random jitter</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng=mulberry32(21);
  const palette=['orange','blue','purple','green','amber','pink'];
  const labels=['Contact','Payment','AI','Survey','Order','Lead'];
  const medias=document.getElementById('medias');
  for(let i=0;i<12;i++){
    const el=document.createElement('div');
    el.className='bubble';
    el.dataset.c=palette[i%palette.length];
    el.style.left='50%';el.style.top='50%';
    el.innerHTML=`<div class="badge">${labels[i%labels.length]}</div><div class="ttl">${labels[i%labels.length]}</div><div class="submit">→</div>`;
    medias.appendChild(el);
  }
  const bubbles=gsap.utils.toArray('.bubble');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const cs={x:960,y:540};
  const ghost=document.getElementById('ghost');
  gsap.set(ghost,{x:cs.x,y:cs.y});

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.ghost',{opacity:1,duration:0.4},0.2);

  // cursor path — figure-8 ish
  const wp=[{x:400,y:300},{x:1500,y:300},{x:1500,y:780},{x:400,y:780},{x:400,y:300},{x:1500,y:540}];
  let t=0.5;
  for(const w of wp){
    tl.to(cs,{x:w.x,y:w.y,duration:1.6,ease:'sine.inOut',onUpdate:()=>gsap.set(ghost,{x:cs.x,y:cs.y})},t);
    t+=1.6;
  }

  // each bubble has individual chase with seeded random offset
  bubbles.forEach((b,i)=>{
    const offX=(rng()-0.5)*120, offY=(rng()-0.5)*120;
    const damping=0.10+rng()*0.07;
    const rot=(rng()-0.5)*30;
    const pos={x:cs.x,y:cs.y};
    tl.to(b,{opacity:1,duration:0.4},0.3+i*0.04);
    gsap.ticker.add(()=>{
      if(tl.paused()&&tl.time()===0)return;
      const target={x:cs.x+offX,y:cs.y+offY};
      pos.x+=(target.x-pos.x)*damping;
      pos.y+=(target.y-pos.y)*damping;
      b.style.transform=`translate(${pos.x-960}px, ${pos.y-540}px) rotate(${rot*0.5}deg)`;
    });
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
