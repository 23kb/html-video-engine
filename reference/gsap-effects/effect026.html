<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 026 — Infinite 2D grid (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#fdfaf3; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .grid-frame { position:absolute; inset:0; overflow:hidden; }
  .grid { position:absolute; will-change:transform; }
  .tile { position:absolute; width:200px; height:240px; background:white; border-radius:12px; box-shadow:0 14px 30px rgba(20,22,28,0.14),0 3px 8px rgba(20,22,28,0.06); padding:14px; display:flex; flex-direction:column; gap:6px; }
  .tile .badge { font-size:9px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .tile .ttl { font-size:13px; font-weight:700; color:var(--wpf-ink); }
  .tile .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:4px; padding:4px 6px; font-size:9px; color:var(--wpf-ink-mute); }
  .tile .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:4px; text-align:center; padding:4px; font-weight:700; font-size:9px; }
  .tile[data-c="blue"]   .badge,.tile[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .tile[data-c="purple"] .badge,.tile[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .tile[data-c="green"]  .badge,.tile[data-c="green"]  .submit { background:#2c8a55; }
  .tile[data-c="amber"]  .badge,.tile[data-c="amber"]  .submit { background:#d59324; }
  .tile[data-c="teal"]   .badge,.tile[data-c="teal"]   .submit { background:#2a8a8e; }
  .tile[data-c="pink"]   .badge,.tile[data-c="pink"]   .submit { background:#c93874; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:8; pointer-events:none; }
  .overlay::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at center,rgba(253,250,243,0) 0%,rgba(253,250,243,0.55) 45%,rgba(253,250,243,0.9) 75%); }
  .overlay-inner { position:relative; text-align:center; opacity:0; }
  .overlay-inner .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:14px; }
  .overlay-inner .title { font-size:78px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.025em; line-height:1; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="grid-frame"><div class="grid" id="grid"></div></div>
  <div class="overlay"><div class="overlay-inner"><div class="kicker">An endless grid of forms</div><div class="title">Pick any one. Scroll anywhere.</div></div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 026 · infinite 2D grid drift</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng = mulberry32(26);
  const palette = ['orange','blue','purple','green','amber','teal','pink'];
  const titles = ['Contact','Payment','AI','Survey','Order','Event','Lead','Booking','Donate','Waitlist','Feedback','Login'];

  // build a tiled grid: 8 cols × 6 rows × 1 (duplicated via translate-modifier)
  const grid = document.getElementById('grid');
  const COLS = 10, ROWS = 8;
  const W = 200, H = 240, GX = 30, GY = 30;
  const cellW = W + GX, cellH = H + GY;
  grid.style.width = (COLS * cellW) + 'px';
  grid.style.height = (ROWS * cellH) + 'px';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const idx = r * COLS + c;
      const ttl = titles[idx % titles.length];
      const cls = palette[Math.floor(rng()*palette.length)];
      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.c = cls;
      el.style.left = (c * cellW) + 'px';
      el.style.top = (r * cellH) + 'px';
      el.innerHTML = `<div class="badge">${ttl}</div><div class="ttl">${ttl} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div>`;
      grid.appendChild(el);
    }
  }

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  // start the grid offset so center area is filled
  gsap.set(grid, { x: -400, y: -400 });

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // drift diagonally (down-right then up-left) while wrapping with modifiers
  const dx = -COLS * cellW, dy = -ROWS * cellH;
  const totalW = COLS * cellW, totalH = ROWS * cellH;
  tl.to(grid, {
    x: `+=${dx}`, y: `+=${dy}`, duration: 22, ease: 'none',
    modifiers: {
      x: (s) => gsap.utils.wrap(-totalW, 0, parseFloat(s)) + 'px',
      y: (s) => gsap.utils.wrap(-totalH, 0, parseFloat(s)) + 'px'
    }
  }, 0);

  // overlay appears mid-scene
  tl.to('.overlay-inner', { opacity: 1, duration: 0.8 }, 1.6)
    .from('.overlay-inner .kicker', { y: 18, opacity: 0, duration: 0.6 }, 1.6)
    .from('.overlay-inner .title', { y: 24, opacity: 0, duration: 0.6 }, 1.75);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
