<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 030 — List hover image reveal (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#fdfaf3; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .layout { position:absolute; inset:120px 80px; display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { font-size:64px; font-weight:600; color:var(--wpf-ink); letter-spacing:-0.02em; padding:18px 0; border-bottom:1px solid #d4cab8; cursor:default; transition:opacity 0.4s, transform 0.4s, color 0.4s; }
  ul.list li.active { color:var(--wpf-orange); transform:translateX(20px); }
  ul.list li.dim { opacity:0.3; }
  .media-container { position:relative; height:560px; overflow:hidden; border-radius:20px; box-shadow:0 30px 60px rgba(20,22,28,0.18); }
  .medias { position:absolute; inset:0; }
  .media { position:absolute; inset:0; padding:32px; display:flex; flex-direction:column; gap:16px; background:white; opacity:0; will-change:transform,opacity; }
  .media .badge { font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; padding:5px 12px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:30px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.015em; line-height:1.15; }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:14px 18px; font-size:15px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:16px; font-weight:700; font-size:16px; }
  .media[data-c="blue"]   .badge,.media[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"]  .badge,.media[data-c="green"]  .submit { background:#2c8a55; }
  .media[data-c="amber"]  .badge,.media[data-c="amber"]  .submit { background:#d59324; }
  .media[data-c="pink"]   .badge,.media[data-c="pink"]   .submit { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="layout">
    <ul class="list" id="list">
      <li data-i="0">Contact</li>
      <li data-i="1">Payment</li>
      <li data-i="2">AI Forms</li>
      <li data-i="3">Survey</li>
      <li data-i="4">Event RSVP</li>
    </ul>
    <div class="media-container"><div class="medias" id="medias"></div></div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 030 · list hover image reveal</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange',t:'Tell us about your project'},{k:'Payment',c:'blue',t:'Stripe Checkout'},{k:'AI',c:'purple',t:'Generate by prompt'},{k:'Survey',c:'green',t:'NPS Feedback'},{k:'Event',c:'amber',t:'RSVP — Summit 2026'}];
  const medias=document.getElementById('medias');
  items.forEach((it,i)=>{
    const el=document.createElement('div');
    el.className='media';el.dataset.c=it.c;el.dataset.i=i;
    el.innerHTML=`<div class="badge">${it.k}</div><div class="ttl">${it.t}</div><div class="field">Field</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div>`;
    medias.appendChild(el);
  });
  const mediaEls=gsap.utils.toArray('.media');
  const listItems=gsap.utils.toArray('#list li');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);

  // hover through each list item sequentially; reveals corresponding media with Y-mask
  let t=0.6;
  items.forEach((it,i)=>{
    tl.call(()=>{
      listItems.forEach((li,j)=>{
        li.classList.toggle('active',j===i);
        li.classList.toggle('dim',j!==i);
      });
    },null,t);
    tl.fromTo(mediaEls[i],{y:'100%',opacity:1},{y:'0%',duration:0.7,ease:'power3.out'},t);
    if(i>0)tl.to(mediaEls[i-1],{opacity:0,duration:0.3,ease:'power2.in'},t+0.5);
    t+=1.4;
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
