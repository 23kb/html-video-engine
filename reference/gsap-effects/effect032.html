<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 032 — Circular text on SVG path (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#1d1812 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .ring-stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .ring-wrap { position:relative; width:900px; height:900px; }
  .ring { width:100%; height:100%; will-change:transform; }
  .ring text { font-family:var(--wpf-font-stack); font-size:48px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
  .ring text.outer { fill:#faf6ee; }
  .ring text.inner { fill:var(--wpf-orange); font-size:36px; }
  .center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; opacity:0; }
  .center .dot { width:80px; height:80px; border-radius:50%; background:var(--wpf-orange); margin:0 auto 18px; box-shadow:0 0 60px rgba(226,119,48,0.5); }
  .center .name { font-size:50px; font-weight:800; color:#faf6ee; letter-spacing:-0.025em; }
  .center .sub { color:rgba(250,246,238,0.5); font-size:16px; margin-top:8px; letter-spacing:0.16em; text-transform:uppercase; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="ring-stage"><div class="ring-wrap">
    <svg class="ring" id="ringOuter" viewBox="0 0 900 900">
      <defs><path id="outerCirc" d="M 450 450 m -380 0 a 380 380 0 1 1 760 0 a 380 380 0 1 1 -760 0"/></defs>
      <text class="outer"><textPath href="#outerCirc">FORMS · THAT · CONVERT · FORMS · THAT · CONVERT · </textPath></text>
    </svg>
    <svg class="ring" id="ringInner" viewBox="0 0 900 900" style="position:absolute;inset:0;">
      <defs><path id="innerCirc" d="M 450 450 m -290 0 a 290 290 0 1 1 580 0 a 290 290 0 1 1 -580 0"/></defs>
      <text class="inner"><textPath href="#innerCirc">★ BUILT · SHIPPED · LOVED ★ BUILT · SHIPPED · LOVED ★ BUILT · SHIPPED · LOVED </textPath></text>
    </svg>
    <div class="center"><div class="dot"></div><div class="name">WPForms</div><div class="sub">Since 2017</div></div>
  </div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 032 · circular text on SVG path</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // outer ring rotates one way, inner the other
  tl.to('#ringOuter', { rotation: 360, duration: 18, ease: 'none', transformOrigin: '50% 50%' }, 0);
  tl.to('#ringInner', { rotation: -360, duration: 14, ease: 'none', transformOrigin: '50% 50%' }, 0);

  // center reveals
  tl.to('.center', { opacity: 1, duration: 0.7, ease: 'power2.out' }, 0.6)
    .from('.center .dot', { scale: 0, duration: 0.7, ease: 'back.out(1.6)' }, 0.6)
    .from('.center .name', { y: 20, opacity: 0, duration: 0.6 }, 0.8)
    .from('.center .sub', { y: 14, opacity: 0, duration: 0.5 }, 1.0);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
