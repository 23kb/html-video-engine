<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 033 — Random gallery horizontal (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ebe0c8 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .header { position:absolute; top:80px; right:80px; text-align:right; color:var(--wpf-ink-mute); font-size:13px; letter-spacing:0.18em; text-transform:uppercase; opacity:0; z-index:10; }
  .header .num { color:var(--wpf-orange); font-size:48px; font-weight:700; font-variant-numeric:tabular-nums; display:block; line-height:1; margin-top:6px; letter-spacing:-0.02em; }
  .gallery { position:absolute; inset:0; overflow:hidden; }
  .item { position:absolute; will-change:transform,opacity; opacity:0; }
  .card { width:100%; height:100%; background:white; border-radius:16px; box-shadow:0 16px 36px rgba(20,22,28,0.18),0 4px 10px rgba(20,22,28,0.06); overflow:hidden; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .card .badge { font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .card .ttl { font-size:14px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.005em; line-height:1.18; }
  .card .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:5px; padding:5px 7px; font-size:9px; color:var(--wpf-ink-mute); }
  .card .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:5px; text-align:center; padding:5px; font-weight:700; font-size:9px; }
  .item[data-c="blue"]   .badge,.item[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .item[data-c="purple"] .badge,.item[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .item[data-c="green"]  .badge,.item[data-c="green"]  .submit { background:#2c8a55; }
  .item[data-c="amber"]  .badge,.item[data-c="amber"]  .submit { background:#d59324; }
  .item[data-c="teal"]   .badge,.item[data-c="teal"]   .submit { background:#2a8a8e; }
  .item[data-c="pink"]   .badge,.item[data-c="pink"]   .submit { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="header"><span>Collection</span><span class="num">14</span></div>
  <div class="gallery" id="gallery"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 033 · random gallery horizontal flow</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng = mulberry32(33);
  const palette = ['orange','blue','purple','green','amber','teal','pink'];
  const titles = ['Contact','Payment','AI','Survey','Order','Event','Lead','Booking','Donate','Waitlist','Feedback','Login','Refund','Quote'];

  const gallery = document.getElementById('gallery');
  const N = 14;
  for (let i = 0; i < N; i++) {
    const w = 180 + rng() * 130;
    const h = 220 + rng() * 100;
    const y = 100 + rng() * 720;
    const c = palette[Math.floor(rng()*palette.length)];
    const ttl = titles[i];
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.c = c;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.top = y + 'px';
    el.style.left = '0px';
    el.dataset.idx = i;
    el.innerHTML = `<div class="card"><div class="badge">${ttl}</div><div class="ttl">${ttl} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Send</div></div>`;
    gallery.appendChild(el);
  }
  const items = gsap.utils.toArray('.item');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.header', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.25);

  // each item travels left→right through the viewport, with fade in/out at edges
  items.forEach((el, i) => {
    const start = 0.6 + i * 0.65;
    const dur = 4 + rng() * 2;
    gsap.set(el, { x: -400, opacity: 0, rotate: (rng()-0.5)*8 });
    tl.to(el, { opacity: 1, duration: 0.6, ease: 'power2.out' }, start);
    tl.to(el, { x: 2200, duration: dur, ease: 'none' }, start);
    tl.to(el, { opacity: 0, duration: 0.6, ease: 'power2.in' }, start + dur - 0.6);
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
