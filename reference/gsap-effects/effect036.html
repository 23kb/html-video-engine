<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 036 — Hover word shuffles cards (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .sentence { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); padding:0 120px; font-size:64px; font-weight:600; color:var(--wpf-ink); letter-spacing:-0.02em; line-height:1.25; text-align:center; }
  .sentence .hover { color:var(--wpf-orange); cursor:pointer; }
  .sentence .hover.active { background:rgba(226,119,48,0.15); padding:2px 12px; border-radius:8px; }
  .medias { position:absolute; inset:0; pointer-events:none; }
  .media { position:absolute; width:200px; height:260px; margin:-130px 0 0 -100px; background:white; border-radius:14px; box-shadow:0 18px 40px rgba(20,22,28,0.2); padding:14px; display:flex; flex-direction:column; gap:8px; will-change:transform,opacity; opacity:0; transform-origin:center; }
  .media .badge { font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:13px; font-weight:700; color:var(--wpf-ink); }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:5px; padding:5px 7px; font-size:9px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:5px; text-align:center; padding:5px; font-weight:700; font-size:10px; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <p class="sentence">When you need <span class="hover" data-i="0">forms</span> for <span class="hover" data-i="1">leads</span> and <span class="hover" data-i="2">payments</span>, just hover.</p>
  <div class="medias" id="medias"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 036 · hover word shuffles cards</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng=mulberry32(36);
  const labels=['Contact','Lead','Payment','Survey','Order','AI','Event','Donate'];
  const medias=document.getElementById('medias');
  for(let i=0;i<8;i++){
    const el=document.createElement('div');
    el.className='media';
    el.style.left='50%';el.style.top='50%';
    el.innerHTML=`<div class="badge">${labels[i]}</div><div class="ttl">${labels[i]}</div><div class="field">F</div><div class="field">F</div><div class="submit">→</div>`;
    medias.appendChild(el);
  }
  const ms=gsap.utils.toArray('.media');
  const hovers=gsap.utils.toArray('.hover');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);

  let t=0.6;
  hovers.forEach((h,hi)=>{
    tl.call(()=>{hovers.forEach((hv,j)=>hv.classList.toggle('active',j===hi));},null,t);

    // burst cards from center to random positions
    ms.forEach((m,i)=>{
      const x=(rng()-0.5)*1400, y=(rng()-0.5)*700, rot=(rng()-0.5)*40;
      tl.to(m,{opacity:1,x,y,rotation:rot,duration:0.4,ease:'back.out(1.6)'},t);
    });
    // hold
    t+=1.2;
    // pull back to center
    ms.forEach((m)=>{tl.to(m,{opacity:0,x:0,y:0,rotation:0,duration:0.5,ease:'power2.in'},t);});
    t+=0.7;
  });

  // final: all hover marks cleared
  tl.call(()=>{hovers.forEach(h=>h.classList.remove('active'));},null,t);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
