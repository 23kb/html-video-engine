<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 037 — Fading gradient mask reveal (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ebe0c8 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .images { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:1300px; height:700px; }
  .hidden { position:absolute; inset:0; overflow:hidden; -webkit-mask-image:linear-gradient(180deg,black 0%,black 50%,transparent 50%,transparent 100%); mask-image:linear-gradient(180deg,black 0%,black 50%,transparent 50%,transparent 100%); -webkit-mask-size:100% 200%; mask-size:100% 200%; -webkit-mask-position:0% 100%; mask-position:0% 100%; }
  .media { position:absolute; inset:0; background:white; border-radius:24px; box-shadow:0 30px 60px rgba(20,22,28,0.18),0 8px 18px rgba(20,22,28,0.08); padding:48px; display:flex; flex-direction:column; gap:18px; }
  .media .badge { font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; padding:5px 14px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:48px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; line-height:1.05; }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:16px 20px; font-size:18px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:18px; font-weight:700; font-size:20px; }
  .hidden[data-c="blue"]   .badge,.hidden[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .hidden[data-c="purple"] .badge,.hidden[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .hidden[data-c="green"]  .badge,.hidden[data-c="green"]  .submit { background:#2c8a55; }
  .hidden[data-c="amber"]  .badge,.hidden[data-c="amber"]  .submit { background:#d59324; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="images" id="images"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 037 · fading gradient mask reveal</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items = [
    { c:'orange', k:'Contact', t:'Tell us about your project' },
    { c:'blue',   k:'Payment', t:'Stripe Subscription' },
    { c:'purple', k:'AI',      t:'Generate a form by prompt' },
    { c:'green',  k:'Survey',  t:'How was your experience?' },
    { c:'amber',  k:'Event',   t:'RSVP — Summit 2026' },
  ];
  const images = document.getElementById('images');
  items.forEach((it) => {
    const hidden = document.createElement('div');
    hidden.className = 'hidden';
    hidden.dataset.c = it.c;
    hidden.innerHTML = `<div class="media">
      <div class="badge">${it.k}</div>
      <div class="ttl">${it.t}</div>
      <div class="field">Field</div>
      <div class="field">Field</div>
      <div class="field">Field</div>
      <div class="submit">Submit</div>
    </div>`;
    images.appendChild(hidden);
  });
  const hiddens = gsap.utils.toArray('.hidden');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // each hidden div has a gradient mask. We animate mask-position from 0% 100% (hidden) → 0% 0% (fully visible)
  hiddens.forEach((h, i) => {
    const t = 0.5 + i * 1.0;
    // reveal
    tl.fromTo(h, { '-webkit-mask-position': '0% 100%', maskPosition: '0% 100%' },
                  { '-webkit-mask-position': '0% 0%',   maskPosition: '0% 0%',   duration: 0.9, ease: 'power2.inOut' }, t);
    // hide next
    if (i < hiddens.length - 1) {
      tl.to(h, { '-webkit-mask-position': '0% -100%', maskPosition: '0% -100%', duration: 0.9, ease: 'power2.inOut' }, t + 1.2);
    }
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
