<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 038 — Horizontal flipbook (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(135deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); display:flex; align-items:center; will-change:transform; }
  .project { display:flex; align-items:center; gap:60px; flex-shrink:0; padding:0 120px; width:1920px; }
  .datas { width:600px; }
  .label { font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; color:var(--wpf-orange); margin-bottom:14px; }
  .year { font-size:30px; color:var(--wpf-ink-mute); font-weight:600; margin-bottom:18px; }
  .title { font-size:64px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.025em; line-height:1.05; }
  .media { flex:1; height:600px; background:white; border-radius:24px; box-shadow:0 40px 80px rgba(20,22,28,0.18); padding:36px; display:flex; flex-direction:column; gap:18px; }
  .media .badge { font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:5px 14px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:30px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.015em; }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:12px 16px; font-size:15px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:14px; font-weight:700; font-size:16px; }
  .project[data-c="blue"]   .label,.project[data-c="blue"]   .media .badge,.project[data-c="blue"]   .media .submit { background:var(--wpf-blue); }
  .project[data-c="purple"] .label,.project[data-c="purple"] .media .badge,.project[data-c="purple"] .media .submit { background:var(--wpf-ai-purple); }
  .project[data-c="green"]  .label,.project[data-c="green"]  .media .badge,.project[data-c="green"]  .media .submit { background:#2c8a55; }
  .project[data-c="blue"]   .label,.project[data-c="purple"] .label,.project[data-c="green"] .label { background:transparent; color:var(--wpf-blue); }
  .project[data-c="purple"] .label { color:var(--wpf-ai-purple); }
  .project[data-c="green"]  .label { color:#2c8a55; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container" id="container"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 038 · horizontal flipbook scroll</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const projects=[
    {l:'Project 01',y:'2017',c:'orange',t:'WPForms launches',k:'Contact'},
    {l:'Project 02',y:'2019',c:'blue',  t:'Payments shipped',k:'Payment'},
    {l:'Project 03',y:'2022',c:'purple',t:'AI form generator',k:'AI'},
    {l:'Project 04',y:'2024',c:'green', t:'9,000 integrations',k:'Integrations'},
  ];
  const c=document.getElementById('container');
  projects.forEach((p)=>{
    const el=document.createElement('div');
    el.className='project';el.dataset.c=p.c;
    el.innerHTML=`<div class="datas"><div class="label">${p.l}</div><div class="year">${p.y}</div><div class="title">${p.t}</div></div><div class="media"><div class="badge">${p.k}</div><div class="ttl">${p.k} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div></div>`;
    c.appendChild(el);
  });

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.container',{x:-1920*(projects.length-1),duration:10,ease:'power1.inOut'},0.4);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
