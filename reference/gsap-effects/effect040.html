<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 040 — Dual circular carousel (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .parent-circle { position:absolute; top:50%; width:1200px; height:1200px; margin-top:-600px; }
  .parent-circle-left { left:-700px; }
  .parent-circle-right { right:-700px; }
  .ring { position:absolute; inset:0; will-change:transform; }
  .circle { position:absolute; top:50%; left:50%; width:160px; height:160px; margin:-80px 0 0 -80px; transform-origin:center 600px; }
  .label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:white; border-radius:50%; box-shadow:0 14px 30px rgba(20,22,28,0.18); color:var(--wpf-ink); font-weight:700; font-size:18px; text-align:center; padding:18px; }
  .media { position:absolute; inset:0; background:var(--wpf-orange); color:white; border-radius:18px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; padding:14px; text-align:center; }
  .circle[data-c="blue"] .media { background:var(--wpf-blue); }
  .circle[data-c="purple"] .media { background:var(--wpf-ai-purple); }
  .circle[data-c="green"] .media { background:#2c8a55; }
  .circle[data-c="amber"] .media { background:#d59324; }
  .circle[data-c="teal"] .media { background:#2a8a8e; }
  .circle[data-c="pink"] .media { background:#c93874; }
  .center-headline { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); text-align:center; font-size:46px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; padding:0 80px; opacity:0; z-index:5; }
  .center-headline .accent { color:var(--wpf-orange); }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container">
    <div class="parent-circle parent-circle-left"><div class="ring" id="ringL"></div></div>
    <div class="parent-circle parent-circle-right"><div class="ring" id="ringR"></div></div>
    <div class="center-headline">Forms <span class="accent">on one side</span>, integrations <span class="accent">on the other</span>.</div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 040 · dual circular carousel</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const labelsL=['Contact','Payment','AI','Survey','Order','Booking','Lead','Event'];
  const labelsR=['Mailchimp','Stripe','Slack','Zapier','HubSpot','Klaviyo','Drip','Webhook'];
  const colors=['orange','blue','purple','green','amber','teal','pink','orange'];

  function build(ringEl, labels){
    const N=labels.length;
    labels.forEach((l,i)=>{
      const angle=i*(360/N);
      const el=document.createElement('div');
      el.className='circle';
      el.dataset.c=colors[i];
      el.style.transform=`rotate(${angle}deg)`;
      el.innerHTML=`<div class="media">${l}</div>`;
      ringEl.appendChild(el);
    });
  }
  build(document.getElementById('ringL'),labelsL);
  build(document.getElementById('ringR'),labelsR);

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('#ringL',{rotation:360,duration:18,ease:'none'},0);
  tl.to('#ringR',{rotation:-360,duration:18,ease:'none'},0);
  tl.to('.center-headline',{opacity:1,duration:0.8,ease:'power2.out'},1.0);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
