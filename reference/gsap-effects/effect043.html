<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 043 — Curved fan on enter + hover lift (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdf8f0 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .header { position:absolute; top:100px; left:0; right:0; text-align:center; opacity:0; z-index:5; }
  .header .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:10px; }
  .header .title { font-size:54px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.025em; }
  .container { position:absolute; bottom:120px; left:0; right:0; height:520px; display:flex; align-items:flex-end; justify-content:center; }
  .card-wrapper { position:relative; width:260px; height:340px; transform-origin:center 500px; will-change:transform; opacity:0; }
  .card { width:100%; height:100%; background:white; border-radius:18px; box-shadow:0 20px 50px rgba(20,22,28,0.18); padding:18px; display:flex; flex-direction:column; gap:10px; will-change:transform; }
  .card .badge { font-size:11px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .card .ttl { font-size:18px; font-weight:700; color:var(--wpf-ink); }
  .card .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:6px; padding:8px 10px; font-size:12px; color:var(--wpf-ink-mute); }
  .card .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:6px; text-align:center; padding:8px; font-weight:700; font-size:12px; }
  .card-wrapper[data-c="blue"]   .badge,.card-wrapper[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .card-wrapper[data-c="purple"] .badge,.card-wrapper[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .card-wrapper[data-c="green"]  .badge,.card-wrapper[data-c="green"]  .submit { background:#2c8a55; }
  .card-wrapper[data-c="amber"]  .badge,.card-wrapper[data-c="amber"]  .submit { background:#d59324; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="header"><div class="kicker">Built for every case</div><div class="title">Five forms, one fan.</div></div>
  <div class="container" id="container"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 043 · curved fan + hover lift</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange'},{k:'Payment',c:'blue'},{k:'AI',c:'purple'},{k:'Survey',c:'green'},{k:'Order',c:'amber'}];
  const c=document.getElementById('container');
  items.forEach((it)=>{
    const w=document.createElement('div');
    w.className='card-wrapper';w.dataset.c=it.c;
    w.innerHTML=`<div class="card"><div class="badge">${it.k}</div><div class="ttl">${it.k} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div></div>`;
    c.appendChild(w);
  });
  const wraps=gsap.utils.toArray('.card-wrapper');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // initial: all cards collapsed at center, rotated 0
  wraps.forEach((w)=>gsap.set(w,{rotation:0,opacity:0,y:200}));

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1)
    .to('.header',{opacity:1,duration:0.6},0.25)
    .from('.header .kicker',{y:18,opacity:0,duration:0.5},0.25)
    .from('.header .title',{y:24,opacity:0,duration:0.6},0.4);

  // fan out
  const N=wraps.length;
  const arc=70;
  wraps.forEach((w,i)=>{
    const angle=-arc/2+(arc/(N-1))*i;
    tl.to(w,{rotation:angle,y:0,opacity:1,duration:0.9,ease:'back.out(1.3)'},0.8+i*0.08);
  });

  // hover sequence: lift each card in turn (and reset previous)
  let t=2.0;
  wraps.forEach((w,i)=>{
    tl.to(w,{y:-60,scale:1.08,duration:0.5,ease:'power2.out'},t);
    tl.to(w,{y:0,scale:1,duration:0.5,ease:'power2.inOut'},t+0.8);
    t+=0.7;
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
