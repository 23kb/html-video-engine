<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 045 — Folders perspective cycle (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#1f1810 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); perspective:1600px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .root { position:absolute; top:50%; left:50%; transform-style:preserve-3d; will-change:transform; }
  .slide { position:absolute; top:0; left:0; width:520px; height:660px; margin:-330px 0 0 -260px; background:white; border-radius:22px; box-shadow:0 40px 80px rgba(0,0,0,0.5); padding:32px; display:flex; flex-direction:column; gap:16px; backface-visibility:hidden; will-change:transform; }
  .slide .badge { font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; padding:5px 14px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .slide .ttl { font-size:30px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.015em; line-height:1.15; }
  .slide .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:12px 16px; font-size:15px; color:var(--wpf-ink-mute); }
  .slide .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:14px; font-weight:700; font-size:16px; }
  .slide[data-c="blue"] .badge,.slide[data-c="blue"] .submit { background:var(--wpf-blue); }
  .slide[data-c="purple"] .badge,.slide[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .slide[data-c="green"] .badge,.slide[data-c="green"] .submit { background:#2c8a55; }
  .slide[data-c="amber"] .badge,.slide[data-c="amber"] .submit { background:#d59324; }
  .ghost { position:absolute; width:30px; height:30px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 24px rgba(226,119,48,0.7); pointer-events:none; z-index:20; transform:translate(-50%,-50%); opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="root" id="root"></div>
  <div class="ghost" id="ghost"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 045 · folders perspective cycle</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange',t:'Tell us about you'},{k:'Payment',c:'blue',t:'Stripe Checkout'},{k:'AI',c:'purple',t:'Generate by prompt'},{k:'Survey',c:'green',t:'NPS Feedback'},{k:'Event',c:'amber',t:'Event RSVP'}];
  const root=document.getElementById('root');
  items.forEach((it,i)=>{
    const el=document.createElement('div');
    el.className='slide';el.dataset.c=it.c;el.dataset.i=i;
    el.innerHTML=`<div class="badge">${it.k}</div><div class="ttl">${it.t}</div><div class="field">Field</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div>`;
    root.appendChild(el);
  });
  const slides=gsap.utils.toArray('.slide');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // stacked positions
  function layout(){
    slides.forEach((s,i)=>{
      gsap.set(s,{z:-i*80,y:i*20,opacity:i<4?1-i*0.18:0,zIndex:slides.length-i});
    });
  }
  layout();

  const cs={x:960,y:540};
  const ghost=document.getElementById('ghost');

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.ghost',{opacity:1,duration:0.4},0.2);

  // root rotates based on cursor position
  gsap.ticker.add(()=>{
    if(tl.paused()&&tl.time()===0)return;
    const dx=(cs.x-960)/960, dy=(cs.y-540)/540;
    root.style.transform=`translate(-50%,-50%) rotateY(${dx*10}deg) rotateX(${-dy*8}deg)`;
  });

  // cursor path
  const wp=[{x:400,y:400},{x:1500,y:400},{x:1500,y:800},{x:400,y:800},{x:960,y:540}];
  let t=0.5;
  for(const w of wp){
    tl.to(cs,{x:w.x,y:w.y,duration:1.4,ease:'sine.inOut',onUpdate:()=>gsap.set(ghost,{x:cs.x,y:cs.y})},t);
    t+=1.4;
  }

  // CYCLE: front slide moves to back at intervals
  for(let r=0;r<3;r++){
    const ct=1.0+r*2.2;
    tl.call(()=>{
      const first=slides.shift(); slides.push(first); layout();
    },null,ct);
  }

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
