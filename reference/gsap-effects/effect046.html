<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Effect 046 — Random-order letter reveal (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root {
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0806;
    font-family: var(--wpf-font-stack);
    overflow: hidden;
    color: var(--wpf-ink);
  }

  .stage-wrap {
    position: relative;
    width: 100vw; height: calc(100vh - 56px);
    display: flex; align-items: center; justify-content: center;
  }
  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: center center;
    background: linear-gradient(180deg, #faf6ee 0%, #f1ead8 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  .brand {
    position: absolute;
    top: 60px; left: 80px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
    opacity: 0;
  }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--wpf-orange); }
  .brand .name { font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--wpf-ink-soft); }

  .kicker {
    position: absolute;
    top: 60px; right: 80px;
    z-index: 10;
    color: var(--wpf-orange);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    opacity: 0;
  }

  .pin {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .container {
    width: 1680px;
    text-align: center;
    padding: 0 60px;
  }
  .sentence {
    font-size: 124px;
    font-weight: 700;
    color: var(--wpf-ink);
    letter-spacing: -0.025em;
    line-height: 1.05;
    text-align: center;
  }
  .sentence .char {
    display: inline-block;
    will-change: transform, opacity;
  }
  .sentence .char.space {
    width: 0.30em;
  }
  .sentence .char.accent { color: var(--wpf-orange); }

  /* a thin underline that draws across after the reveal */
  .underline {
    position: absolute;
    top: 50%; left: 50%;
    margin-top: 90px;
    width: 0;
    height: 4px;
    background: var(--wpf-orange);
    border-radius: 2px;
    transform: translateX(-50%);
  }

  /* the sub line below */
  .sub {
    position: absolute;
    bottom: 140px;
    left: 0; right: 0;
    text-align: center;
    font-size: 22px;
    color: var(--wpf-ink-mute);
    opacity: 0;
  }
  .sub strong { color: var(--wpf-ink); font-weight: 600; }

  /* controls */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 56px;
    background: #0f0d0c; color: #e8e3dc;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    font-family: var(--wpf-font-stack);
    font-size: 13px;
  }
  .controls button {
    background: var(--wpf-orange); color: white; border: 0;
    padding: 8px 16px; border-radius: 6px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .controls button:hover { background: var(--wpf-orange-hover); }
  .controls input[type=range] { flex: 1; accent-color: var(--wpf-orange); }
  .controls .t {
    font-variant-numeric: tabular-nums;
    min-width: 110px; text-align: right; color: #aaa;
  }
  .controls .meta { color: #888; margin-right: 8px; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <div class="brand">
      <div class="dot"></div>
      <div class="name">WPForms</div>
    </div>

    <div class="kicker">Built. Right.</div>

    <div class="pin">
      <div class="container">
        <p class="sentence" id="sentence" data-text="Your forms are way more than fields."></p>
      </div>
    </div>

    <div class="underline" id="underline"></div>

    <div class="sub">
      <strong>WPForms</strong> · think bigger than a contact field.
    </div>

  </div>
</div>

<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 046 · random-order letter reveal</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>

<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  // ---------- deterministic shuffle (mulberry32) ----------
  // Per CLAUDE.md INV-9: use seeded PRNG, not Math.random(), so render parity holds.
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(46);
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- split sentence into per-char spans ----------
  const sentEl = document.getElementById('sentence');
  const text = sentEl.dataset.text;
  const accentWords = ['more', 'fields'];
  // build word→chars while we go so we can identify which chars belong to accent words
  let word = '';
  let charNodes = [];
  for (let i = 0; i <= text.length; i++) {
    const ch = text[i];
    if (ch === undefined || ch === ' ') {
      // flush current word
      const isAccent = accentWords.includes(word.replace(/[^a-z]/gi, ''));
      [...word].forEach((c) => {
        const span = document.createElement('span');
        span.className = 'char' + (isAccent ? ' accent' : '');
        span.textContent = c;
        sentEl.appendChild(span);
        charNodes.push(span);
      });
      word = '';
      if (ch === ' ') {
        const space = document.createElement('span');
        space.className = 'char space';
        space.textContent = ' ';
        sentEl.appendChild(space);
        // spaces are not part of the reveal sequence
      }
    } else {
      word += ch;
    }
  }

  function fit() {
    const stage = document.getElementById('stage');
    const w = window.innerWidth;
    const h = window.innerHeight - 56;
    const scale = Math.min(w / 1920, h / 1080) * 0.96;
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- master timeline ----------
  // Each character starts INVISIBLE & slightly displaced (small random scale + y drift).
  // Reveal order is SHUFFLED — letters appear in random sequence, not left-to-right.
  // Total reveal window ≈ 2.6s.

  charNodes.forEach((el) => gsap.set(el, { y: 18, opacity: 0, scale: 0.85 }));

  const order = shuffle(charNodes);

  const tl = gsap.timeline({ paused: true });

  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.kicker', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.25);

  const REVEAL_START = 0.7;
  const TOTAL_REVEAL = 2.6;
  const perChar = TOTAL_REVEAL / order.length;

  order.forEach((el, i) => {
    tl.to(el, {
      y: 0,
      opacity: 1,
      scale: 1,
      duration: 0.55,
      ease: 'power3.out'
    }, REVEAL_START + i * perChar);
  });

  const revealEnd = REVEAL_START + TOTAL_REVEAL + 0.2;

  // underline sweeps in
  tl.to('.underline', { width: 380, duration: 0.7, ease: 'power3.out' }, revealEnd);

  // sub line fades in
  tl.to('.sub', { opacity: 1, duration: 0.7 }, revealEnd + 0.2)
    .from('.sub', { y: 14, duration: 0.7 }, revealEnd + 0.2);

  // ---------- scrubber ----------
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  const playBtn = document.getElementById('playBtn');

  function updateTime() {
    const t = tl.time(), d = tl.duration();
    timeEl.textContent = t.toFixed(2).padStart(5,'0') + ' / ' + d.toFixed(2).padStart(5,'0');
  }
  scrub.addEventListener('input', () => {
    tl.pause(); playBtn.textContent = 'Play';
    tl.progress(parseFloat(scrub.value)/100); updateTime();
  });
  gsap.ticker.add(() => {
    if (!tl.paused()) {
      scrub.value = (tl.progress()*100).toFixed(2);
      updateTime();
      if (tl.progress() >= 1) playBtn.textContent='Replay';
    }
  });
  playBtn.addEventListener('click', () => {
    if (tl.progress() >= 1) { tl.restart(); playBtn.textContent='Pause'; }
    else if (tl.paused()) { tl.play(); playBtn.textContent='Pause'; }
    else { tl.pause(); playBtn.textContent='Play'; }
  });
  updateTime();
  setTimeout(() => { tl.play(); playBtn.textContent='Pause'; }, 400);
</script>

</body>
</html>
