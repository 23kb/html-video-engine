<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 053 — 3D Y-axis line swap (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:#14110e; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); perspective:1400px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .pin-height { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .container { position:relative; width:1500px; min-height:400px; padding:60px; transform-style:preserve-3d; }
  .paragraphs { position:relative; height:300px; }
  .quote { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px; font-size:52px; font-weight:500; color:#faf6ee; letter-spacing:-0.01em; line-height:1.2; text-align:center; padding:0 60px; transform-style:preserve-3d; backface-visibility:hidden; }
  .quote.accent { color:var(--wpf-orange); }
  .quote .line { display:block; will-change:transform,opacity; }
  .bottom { position:absolute; bottom:0; left:60px; right:60px; display:flex; align-items:center; gap:14px; color:rgba(250,246,238,0.6); font-size:14px; opacity:0; }
  .bottom .avatar { width:46px; height:46px; border-radius:50%; background:var(--wpf-orange); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="pin-height"><div class="container">
    <div class="paragraphs">
      <div class="quote"        data-lines='["The forms were live in ten minutes,","and the leads followed that same week."]'></div>
      <div class="quote accent" data-lines='["The AI generator is a cheat code.","Honestly. Hours back every week."]'></div>
      <div class="quote"        data-lines='["Six million sites","can not be wrong."]'></div>
    </div>
    <div class="bottom"><div class="avatar">A</div><div>Anya R. · Founder, Drift Co.</div></div>
  </div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 053 · 3D Y-axis line swap</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const quotes = [...document.querySelectorAll('.quote')];
  quotes.forEach((q) => {
    const lines = JSON.parse(q.dataset.lines);
    q.innerHTML = '';
    lines.forEach((ln) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = ln;
      q.appendChild(div);
    });
  });

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  quotes.forEach((q, i) => {
    gsap.set(q, { rotateY: i === 0 ? 0 : 90, opacity: i === 0 ? 1 : 0 });
    gsap.set(q.querySelectorAll('.line'), { y: i === 0 ? 0 : 30, opacity: i === 0 ? 1 : 0 });
  });

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.bottom', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.4);

  // step through each quote: previous rotates out -90, next rotates in from +90
  const HOLD = 1.5;
  const SWAP = 0.8;
  let cursor = 1.0;

  quotes.forEach((q, i) => {
    if (i === 0) { cursor += HOLD; return; }
    const prev = quotes[i - 1];
    tl.to(prev, { rotateY: -90, opacity: 0, duration: SWAP, ease: 'power3.inOut' }, cursor);
    tl.to(prev.querySelectorAll('.line'), { y: -30, opacity: 0, duration: SWAP, stagger: 0.05, ease: 'power3.in' }, cursor);
    tl.to(q, { rotateY: 0, opacity: 1, duration: SWAP, ease: 'power3.inOut' }, cursor);
    tl.to(q.querySelectorAll('.line'), { y: 0, opacity: 1, duration: SWAP, stagger: 0.08, ease: 'power3.out' }, cursor + 0.15);
    cursor += SWAP + HOLD;
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
