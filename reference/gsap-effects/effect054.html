<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 054 — Pinned cylinder flip stack (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdf8f0 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); perspective:1400px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform-style:preserve-3d; }
  .media { position:absolute; width:540px; height:680px; transform-style:preserve-3d; will-change:transform; padding:0; transform-origin:center; }
  .media .inner { width:100%; height:100%; background:white; border-radius:22px; box-shadow:0 40px 80px rgba(20,22,28,0.2); padding:34px; display:flex; flex-direction:column; gap:18px; }
  .media .badge { font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; padding:5px 14px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:34px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; line-height:1.15; }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:10px; padding:14px 18px; font-size:15px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:10px; text-align:center; padding:14px; font-weight:700; font-size:16px; }
  .media[data-c="blue"] .badge,.media[data-c="blue"] .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"] .badge,.media[data-c="green"] .submit { background:#2c8a55; }
  .media[data-c="amber"] .badge,.media[data-c="amber"] .submit { background:#d59324; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container" id="container"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 054 · pinned cylinder X-axis flip</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange',t:'Tell us about you'},{k:'Payment',c:'blue',t:'Stripe Checkout'},{k:'AI',c:'purple',t:'Generate by prompt'},{k:'Survey',c:'green',t:'NPS Feedback'},{k:'Event',c:'amber',t:'Event RSVP'}];
  const c=document.getElementById('container');
  items.forEach((it,i)=>{
    const el=document.createElement('div');
    el.className='media';el.dataset.c=it.c;el.dataset.i=i;
    el.innerHTML=`<div class="inner"><div class="badge">${it.k}</div><div class="ttl">${it.t}</div><div class="field">Field</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div></div>`;
    c.appendChild(el);
  });
  const ms=gsap.utils.toArray('.media');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // each card sits on a cylinder rotated around X-axis. y offset spaces them.
  const RADIUS=400;
  ms.forEach((m,i)=>{
    const angle=(i/ms.length)*360;
    gsap.set(m,{rotateX:angle,transformOrigin:`center center -${RADIUS}px`});
  });

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  // rotate the WHOLE container around X to bring next card forward
  tl.to(c,{rotateX:-360,duration:14,ease:'power1.inOut',transformOrigin:`center center -${RADIUS}px`},0.4);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
