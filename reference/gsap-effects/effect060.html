<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 060 — Masked vertical image rail (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .content { width:400px; text-align:left; flex-shrink:0; padding-right:80px; opacity:0; }
  .content .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:10px; }
  .content .title { font-size:50px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.025em; line-height:1.05; }
  .slides { position:relative; width:520px; height:880px; }
  .slide { position:absolute; left:0; right:0; overflow:hidden; will-change:height,top,border-radius; }
  .slide .media { position:absolute; inset:0; background:white; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .slide .badge { font-size:11px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .slide .ttl { font-size:22px; font-weight:700; color:var(--wpf-ink); }
  .slide .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:6px; padding:8px 10px; font-size:12px; color:var(--wpf-ink-mute); }
  .slide .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:6px; text-align:center; padding:8px; font-weight:700; font-size:12px; }
  .slide[data-c="blue"] .badge,.slide[data-c="blue"] .submit { background:var(--wpf-blue); }
  .slide[data-c="purple"] .badge,.slide[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .slide[data-c="green"] .badge,.slide[data-c="green"] .submit { background:#2c8a55; }
  .slide[data-c="amber"] .badge,.slide[data-c="amber"] .submit { background:#d59324; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container">
    <div class="content"><div class="kicker">Vertical rail · 060</div><div class="title">The middle one wins your attention.</div></div>
    <div class="slides" id="slides"></div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 060 · masked vertical image rail</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items=[{k:'Contact',c:'orange'},{k:'Payment',c:'blue'},{k:'AI',c:'purple'},{k:'Survey',c:'green'},{k:'Event',c:'amber'}];
  const slides=document.getElementById('slides');
  items.forEach((it)=>{
    const el=document.createElement('div');
    el.className='slide';el.dataset.c=it.c;
    el.innerHTML=`<div class="media"><div class="badge">${it.k}</div><div class="ttl">${it.k} Form</div><div class="field">Field</div><div class="field">Field</div><div class="submit">Submit</div></div>`;
    slides.appendChild(el);
  });
  const sList=gsap.utils.toArray('.slide');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // layout: center slide takes 50% height, neighbors compress; arranged top→bottom
  function layout(focus){
    const totalH=880;
    const focusH=400;
    const otherH=(totalH-focusH)/(sList.length-1);
    let y=0;
    sList.forEach((s,i)=>{
      const isF=(i===focus);
      const h=isF?focusH:otherH;
      const radius=isF?14:isF===false&&Math.abs(i-focus)===1?40:60;
      s.style.top=y+'px';
      s.style.height=h+'px';
      s.style.borderRadius=radius+'px';
      y+=h+8;
    });
  }
  layout(2);

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.content',{opacity:1,duration:0.6},0.25);

  // cycle focus
  for(let i=0;i<sList.length;i++){
    tl.call(()=>layout(i),null,0.7+i*1.4);
  }
  // smooth transition via CSS transitions
  sList.forEach((s)=>{s.style.transition='top 0.7s cubic-bezier(0.3,1,0.4,1), height 0.7s cubic-bezier(0.3,1,0.4,1), border-radius 0.7s';});

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
