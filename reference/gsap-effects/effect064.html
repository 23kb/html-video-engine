<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 064 — Phyllotaxis spiral gallery (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#2a221b 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); perspective:1200px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .text { position:absolute; top:50%; left:0; right:0; text-align:center; transform:translateY(-50%); opacity:0; z-index:8; }
  .text .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:12px; }
  .text-g { font-size:84px; font-weight:700; color:#faf6ee; letter-spacing:-0.025em; line-height:1; }
  .gallery { position:absolute; inset:0; }
  .media { position:absolute; top:50%; left:50%; width:160px; height:200px; margin:-100px 0 0 -80px; background:white; border-radius:14px; box-shadow:0 16px 36px rgba(0,0,0,0.5); padding:12px; display:flex; flex-direction:column; gap:6px; will-change:transform,opacity; opacity:0; }
  .media .badge { font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 6px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:11px; font-weight:700; color:var(--wpf-ink); }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:4px; padding:3px 5px; font-size:7px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:4px; text-align:center; padding:3px; font-weight:700; font-size:8px; }
  .media[data-c="blue"]   .badge,.media[data-c="blue"]   .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"]  .badge,.media[data-c="green"]  .submit { background:#2c8a55; }
  .media[data-c="amber"]  .badge,.media[data-c="amber"]  .submit { background:#d59324; }
  .media[data-c="teal"]   .badge,.media[data-c="teal"]   .submit { background:#2a8a8e; }
  .media[data-c="pink"]   .badge,.media[data-c="pink"]   .submit { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="gallery" id="gallery"></div>
  <div class="text"><div class="kicker">Phyllotaxis · 30 templates</div><div class="text-g">Bloom into view.</div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 064 · phyllotaxis spiral bloom</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const palette = ['orange','blue','purple','green','amber','teal','pink'];
  const titles = ['Contact','Payment','AI','Survey','Order','Event','Lead','Booking','Donate','Login'];
  const gallery = document.getElementById('gallery');
  const N = 30;
  // phyllotaxis spiral: angle = i * 137.5°, radius = c * sqrt(i)
  const C = 70;
  const ANGLE = 137.5 * Math.PI / 180;
  const positions = [];
  for (let i = 0; i < N; i++) {
    const r = C * Math.sqrt(i);
    const t = i * ANGLE;
    positions.push({ x: Math.cos(t) * r, y: Math.sin(t) * r });
    const el = document.createElement('div');
    el.className = 'media';
    el.dataset.c = palette[i % palette.length];
    const ttl = titles[i % titles.length];
    el.innerHTML = `<div class="badge">${ttl}</div><div class="ttl">${ttl}</div><div class="field">F</div><div class="field">F</div><div class="submit">→</div>`;
    gallery.appendChild(el);
  }
  const medias = gsap.utils.toArray('.media');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  // initial: all collapsed at center, deep z, invisible
  medias.forEach((m) => gsap.set(m, { x: 0, y: 0, z: -1200, scale: 0.3, opacity: 0, rotation: 0 }));

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // bloom into phyllotaxis positions one by one
  medias.forEach((m, i) => {
    const p = positions[i];
    tl.to(m, {
      x: p.x, y: p.y, z: 0,
      scale: 1, opacity: 1,
      rotation: (i % 2 === 0 ? 6 : -6),
      duration: 0.9,
      ease: 'back.out(1.4)'
    }, 0.4 + i * 0.06);
  });

  // text fades in mid-bloom
  tl.to('.text', { opacity: 1, duration: 0.7 }, 1.8)
    .from('.text .kicker', { y: 14, opacity: 0, duration: 0.5 }, 1.8)
    .from('.text-g', { y: 24, opacity: 0, duration: 0.6 }, 1.95);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
