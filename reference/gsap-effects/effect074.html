<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 074 — Bottom-hinge trapdoor cards (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); perspective:1400px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .row { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); display:flex; align-items:flex-end; justify-content:center; gap:36px; }
  .card { width:280px; height:380px; position:relative; transform-style:preserve-3d; will-change:transform; transform-origin:center bottom; }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; box-shadow:0 18px 40px rgba(20,22,28,0.18),0 4px 10px rgba(20,22,28,0.08); padding:20px; display:flex; flex-direction:column; gap:10px; }
  .front { background:white; }
  .back { background:#14110e; color:#faf6ee; transform:rotateX(180deg); }
  .card-face .badge { font-size:11px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .card-face .ttl { font-size:20px; font-weight:700; letter-spacing:-0.005em; line-height:1.18; }
  .front .ttl { color:var(--wpf-ink); }
  .back .ttl { color:#faf6ee; }
  .card-face .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:6px; padding:8px 10px; font-size:12px; color:var(--wpf-ink-mute); }
  .back .field { background:#2a221b; border-color:#3a2f25; color:rgba(250,246,238,0.6); }
  .card-face .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:6px; text-align:center; padding:9px; font-weight:700; font-size:13px; }
  .card[data-c="blue"]   .front .badge,.card[data-c="blue"]   .front .submit { background:var(--wpf-blue); }
  .card[data-c="purple"] .front .badge,.card[data-c="purple"] .front .submit { background:var(--wpf-ai-purple); }
  .card[data-c="green"]  .front .badge,.card[data-c="green"]  .front .submit { background:#2c8a55; }
  .card[data-c="amber"]  .front .badge,.card[data-c="amber"]  .front .submit { background:#d59324; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="row" id="row"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 074 · bottom-hinge trapdoor flip</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const items = [
    { c:'orange', f:'Contact',         b:'9,000+ integrations' },
    { c:'blue',   f:'Stripe Checkout', b:'PayPal · Square too' },
    { c:'purple', f:'AI Form',         b:'One prompt. Done.' },
    { c:'green',  f:'NPS Survey',      b:'Live analytics' },
    { c:'amber',  f:'Event RSVP',      b:'Mailchimp + Klaviyo' },
  ];
  const row = document.getElementById('row');
  items.forEach((it) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.c = it.c;
    card.innerHTML = `
      <div class="card-face front">
        <div class="badge">${it.f}</div>
        <div class="ttl">${it.f} Form</div>
        <div class="field">Field</div>
        <div class="field">Field</div>
        <div class="field">Field</div>
        <div class="submit">Submit</div>
      </div>
      <div class="card-face back">
        <div class="badge">Bonus</div>
        <div class="ttl">${it.b}</div>
        <div class="field">Plug it in</div>
        <div class="field">Watch leads land</div>
        <div class="submit">→ See more</div>
      </div>`;
    row.appendChild(card);
  });
  const cards = gsap.utils.toArray('.card');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  cards.forEach((c) => gsap.set(c, { rotateX: 0 }));

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // each card flips on bottom hinge — fronts fall away, backs swing in
  cards.forEach((c, i) => {
    const t = 0.6 + i * 0.45;
    tl.to(c, { rotateX: -180, duration: 1.0, ease: 'power3.inOut' }, t);
  });

  // hold, then flip back in reverse
  const hold = 0.6 + cards.length * 0.45 + 0.6;
  cards.forEach((c, i) => {
    const t = hold + (cards.length - 1 - i) * 0.3;
    tl.to(c, { rotateX: 0, duration: 0.9, ease: 'power3.inOut' }, t);
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
