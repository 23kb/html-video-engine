<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Effect 075 — Fanning circular cards (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root {
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0e0c0a;
    font-family: var(--wpf-font-stack);
    overflow: hidden;
    color: var(--wpf-ink);
  }

  .stage-wrap {
    position: relative;
    width: 100vw; height: calc(100vh - 56px);
    display: flex; align-items: center; justify-content: center;
  }
  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: center center;
    background: radial-gradient(ellipse at center, #fdf8f0 0%, #f1eadc 70%, #e6dcc8 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.40);
  }

  .brand {
    position: absolute;
    top: 56px; left: 64px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
    opacity: 0;
  }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--wpf-orange); }
  .brand .name { font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--wpf-ink-soft); }

  .header {
    position: absolute;
    top: 70px;
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
  }
  .header .kicker {
    font-size: 16px; font-weight: 600;
    color: var(--wpf-orange);
    letter-spacing: 0.20em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .header .title {
    font-size: 56px; font-weight: 700;
    color: var(--wpf-ink);
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  /* ----- the ring stage ----- */
  .ring-stage {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ring {
    position: relative;
    width: 720px;
    height: 720px;
    /* centered; we anchor cards on its perimeter via transform: rotate(angle) translate(radius) */
  }
  .ring .hub {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: 180px; height: 180px;
    border-radius: 50%;
    background: white;
    box-shadow:
      0 20px 60px rgba(20,22,28,0.16),
      0 4px 14px rgba(20,22,28,0.08);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    opacity: 0;
  }
  .ring .hub .hub-inner {
    text-align: center;
  }
  .ring .hub .hub-orange-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--wpf-orange);
    margin: 0 auto 8px;
  }
  .ring .hub .hub-label {
    font-size: 13px; font-weight: 700;
    color: var(--wpf-ink);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* each card sits at the ring center initially; gets translated outward by JS */
  .card {
    position: absolute;
    top: 50%; left: 50%;
    width: 160px; height: 200px;
    margin-top: -100px; margin-left: -80px;
    background: white;
    border-radius: 16px;
    box-shadow:
      0 14px 36px rgba(20,22,28,0.16),
      0 3px 10px rgba(20,22,28,0.06);
    transform-origin: center center;
    overflow: hidden;
    will-change: transform, opacity;
    opacity: 0;
    z-index: 3;
  }
  .card .face {
    position: absolute; inset: 0;
    padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    align-items: flex-start;
  }
  .card .icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
  }
  .card .icon.orange { background: var(--wpf-orange); }
  .card .icon.blue   { background: var(--wpf-blue); }
  .card .icon.green  { background: #2c8a55; }
  .card .icon.purple { background: var(--wpf-ai-purple); }
  .card .icon.amber  { background: #d59324; }
  .card .icon.teal   { background: #2a8a8e; }
  .card .icon.pink   { background: #c93874; }
  .card .icon.slate  { background: #4d566e; }
  .card .name {
    font-size: 15px; font-weight: 700;
    color: var(--wpf-ink);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .card .sub {
    font-size: 11px;
    color: var(--wpf-ink-mute);
    margin-top: auto;
  }

  /* caption row */
  .caption {
    position: absolute;
    bottom: 110px;
    left: 0; right: 0;
    text-align: center;
    opacity: 0;
    z-index: 5;
  }
  .caption .line {
    font-size: 22px;
    color: var(--wpf-ink-soft);
    font-weight: 500;
  }
  .caption .sub {
    color: var(--wpf-ink-mute);
    font-size: 16px;
    margin-top: 6px;
  }

  /* controls */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 56px;
    background: #0f0d0c;
    color: #e8e3dc;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    font-family: var(--wpf-font-stack);
    font-size: 13px;
  }
  .controls button {
    background: var(--wpf-orange);
    color: white;
    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button:hover { background: var(--wpf-orange-hover); }
  .controls input[type=range] {
    flex: 1;
    accent-color: var(--wpf-orange);
  }
  .controls .t {
    font-variant-numeric: tabular-nums;
    min-width: 110px;
    text-align: right;
    color: #aaa;
  }
  .controls .meta { color: #888; margin-right: 8px; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <div class="brand">
      <div class="dot"></div>
      <div class="name">WPForms</div>
    </div>

    <div class="header">
      <div class="kicker">9000+ integrations</div>
      <div class="title">Connect everything.</div>
    </div>

    <div class="ring-stage">
      <div class="ring" id="ring">
        <div class="hub">
          <div class="hub-inner">
            <div class="hub-orange-dot"></div>
            <div class="hub-label">WPForms</div>
          </div>
        </div>
        <!-- cards generated by JS so positions are correct -->
      </div>
    </div>

    <div class="caption">
      <div class="line">Your form. Their inbox. Anywhere.</div>
      <div class="sub">Mailchimp · Stripe · Slack · Zapier · Klaviyo · HubSpot · Drip · Webhooks</div>
    </div>

  </div>
</div>

<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 075 · fanning circular cards</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>

<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  // ---------- generate the 8 integration cards into the ring ----------
  const integrations = [
    { name: 'Mailchimp', icon: 'M', cls: 'amber' },
    { name: 'Stripe',    icon: 'S', cls: 'blue'  },
    { name: 'Slack',     icon: '#', cls: 'pink'  },
    { name: 'Zapier',    icon: 'Z', cls: 'orange'},
    { name: 'Klaviyo',   icon: 'K', cls: 'slate' },
    { name: 'HubSpot',   icon: 'H', cls: 'orange'},
    { name: 'Drip',      icon: 'D', cls: 'green' },
    { name: 'Webhook',   icon: 'W', cls: 'teal'  },
  ];
  const ring = document.getElementById('ring');
  integrations.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.i = i;
    el.innerHTML = `
      <div class="face">
        <div class="icon ${it.cls}">${it.icon}</div>
        <div class="name">${it.name}</div>
        <div class="sub">connected</div>
      </div>`;
    ring.appendChild(el);
  });
  const cards = gsap.utils.toArray('.card');

  // ---------- stage scale ----------
  function fit() {
    const stage = document.getElementById('stage');
    const w = window.innerWidth;
    const h = window.innerHeight - 56;
    const scale = Math.min(w / 1920, h / 1080) * 0.96;
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- compute target positions on the perimeter ----------
  // Each card sits at angle θ from top, distance = RADIUS from ring center.
  // Cards face outward (rotated toward the perimeter normal).
  const RADIUS = 290;
  const COUNT = cards.length;
  const targets = cards.map((_, i) => {
    const angle = (i / COUNT) * 360 - 90;            // -90 so card 0 is at top
    const rad = angle * Math.PI / 180;
    return {
      x: Math.cos(rad) * RADIUS,
      y: Math.sin(rad) * RADIUS,
      rotate: angle + 90                              // face outward (radial)
    };
  });

  // all cards start collapsed at center, no rotation, small scale
  cards.forEach(card => gsap.set(card, { x: 0, y: 0, rotate: 0, scale: 0.4, opacity: 0 }));

  // ---------- master timeline ----------
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Beat A: brand + hub + title appear
  tl.to('.brand', { opacity: 1, duration: 0.5 }, 0.1)
    .to('.header', { opacity: 1, duration: 0.6 }, 0.3)
    .from('.header .kicker', { y: 18, opacity: 0, duration: 0.5 }, 0.3)
    .from('.header .title',  { y: 24, opacity: 0, duration: 0.6 }, 0.45)
    .to('.hub', { opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.5)' }, 0.6)
    .from('.hub', { scale: 0.5, duration: 0.7, ease: 'back.out(1.5)' }, 0.6);

  // Beat B: cards FAN OUT one by one with elastic arrival, ring rotates slightly
  // to make room for each new card (the source effect's "ring rotates to accommodate")
  const fanStart = 1.3;
  const perCard = 0.18;
  cards.forEach((card, i) => {
    const t = fanStart + i * perCard;
    tl.to(card, {
      x: targets[i].x,
      y: targets[i].y,
      rotate: targets[i].rotate,
      scale: 1,
      opacity: 1,
      duration: 0.95,
      ease: 'back.out(1.4)'
    }, t);

    // tiny ring rotation kick each time a new card arrives
    tl.to(ring, {
      rotation: '+=4',
      duration: 0.4,
      ease: 'power2.out'
    }, t);
    tl.to(ring, {
      rotation: '-=4',
      duration: 0.5,
      ease: 'power2.inOut'
    }, t + 0.4);
  });

  // Beat C: a single full slow rotation of the ring (atmosphere)
  const ringSpinStart = fanStart + COUNT * perCard + 0.4;
  tl.to(ring, {
    rotation: '+=360',
    duration: 8,
    ease: 'none'
  }, ringSpinStart);

  // counter-rotate each card so it stays upright while the ring spins
  cards.forEach((card, i) => {
    tl.to(card, {
      rotation: targets[i].rotate - 360,
      duration: 8,
      ease: 'none'
    }, ringSpinStart);
  });

  // hub pulse — subtle breathing
  tl.to('.hub', { scale: 1.05, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, ringSpinStart);

  // caption fades in alongside the ring spin
  tl.to('.caption', { opacity: 1, duration: 0.7 }, ringSpinStart + 0.4)
    .from('.caption .line', { y: 14, opacity: 0, duration: 0.5 }, ringSpinStart + 0.4)
    .from('.caption .sub',  { y: 10, opacity: 0, duration: 0.5 }, ringSpinStart + 0.6);

  // ---------- scrubber wiring ----------
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  const playBtn = document.getElementById('playBtn');

  function updateTime() {
    const t = tl.time();
    const d = tl.duration();
    timeEl.textContent = t.toFixed(2).padStart(5, '0') + ' / ' + d.toFixed(2).padStart(5, '0');
  }

  scrub.addEventListener('input', () => {
    tl.pause();
    playBtn.textContent = 'Play';
    tl.progress(parseFloat(scrub.value) / 100);
    updateTime();
  });

  gsap.ticker.add(() => {
    if (!tl.paused()) {
      scrub.value = (tl.progress() * 100).toFixed(2);
      updateTime();
      if (tl.progress() >= 1) playBtn.textContent = 'Replay';
    }
  });

  playBtn.addEventListener('click', () => {
    if (tl.progress() >= 1) { tl.restart(); playBtn.textContent = 'Pause'; }
    else if (tl.paused()) { tl.play(); playBtn.textContent = 'Pause'; }
    else { tl.pause(); playBtn.textContent = 'Play'; }
  });

  updateTime();
  setTimeout(() => { tl.play(); playBtn.textContent = 'Pause'; }, 400);
</script>

</body>
</html>
