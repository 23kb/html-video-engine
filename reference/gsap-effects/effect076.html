<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 076 — Pinned radial spread (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#fdf8f0 0%,#e9dec8 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .circles { position:relative; width:1100px; height:1100px; will-change:transform; }
  .circle { position:absolute; top:50%; left:50%; width:140px; height:160px; margin:-80px 0 0 -70px; transform-origin:center 500px; will-change:transform; opacity:0; }
  .media { width:100%; height:100%; background:white; border-radius:14px; box-shadow:0 14px 30px rgba(20,22,28,0.16); padding:10px; display:flex; flex-direction:column; gap:4px; }
  .media .badge { font-size:8px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:10px; font-weight:700; color:var(--wpf-ink); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:3px; text-align:center; padding:3px; font-weight:700; font-size:8px; }
  .circle[data-c="blue"] .media .badge,.circle[data-c="blue"] .media .submit { background:var(--wpf-blue); }
  .circle[data-c="purple"] .media .badge,.circle[data-c="purple"] .media .submit { background:var(--wpf-ai-purple); }
  .circle[data-c="green"] .media .badge,.circle[data-c="green"] .media .submit { background:#2c8a55; }
  .circle[data-c="amber"] .media .badge,.circle[data-c="amber"] .media .submit { background:#d59324; }
  .circle[data-c="teal"] .media .badge,.circle[data-c="teal"] .media .submit { background:#2a8a8e; }
  .circle[data-c="pink"] .media .badge,.circle[data-c="pink"] .media .submit { background:#c93874; }
  .hub { position:absolute; top:50%; left:50%; width:140px; height:140px; margin:-70px 0 0 -70px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 60px rgba(226,119,48,0.5); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; z-index:5; opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container">
    <div class="circles" id="circles"></div>
    <div class="hub">WPForms</div>
  </div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 076 · pinned radial spread w/ continuous ring</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const palette=['orange','blue','purple','green','amber','teal','pink'];
  const labels=['Contact','Payment','AI','Survey','Order','Booking','Lead','Event','Donate','Login','Feedback','Waitlist'];
  const ring=document.getElementById('circles');
  const N=12;
  for(let i=0;i<N;i++){
    const el=document.createElement('div');
    el.className='circle';el.dataset.c=palette[i%palette.length];el.dataset.i=i;
    el.innerHTML=`<div class="media"><div class="badge">${labels[i]}</div><div class="ttl">${labels[i]}</div><div class="submit">→</div></div>`;
    ring.appendChild(el);
  }
  const circs=gsap.utils.toArray('.circle');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  // each circle starts at angle 0; we'll redistribute them gradually
  circs.forEach((c)=>gsap.set(c,{rotation:0,opacity:0}));

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.hub',{opacity:1,duration:0.6,ease:'back.out(1.6)'},0.3);

  // reveal each circle in turn, rotating to its position
  circs.forEach((c,i)=>{
    const angle=(i/N)*360;
    tl.to(c,{opacity:1,rotation:angle,duration:1.0,ease:'back.out(1.3)'},0.5+i*0.18);
  });

  // continuous ring rotation while distributing
  tl.to(ring,{rotation:360,duration:10,ease:'none'},2.5);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
