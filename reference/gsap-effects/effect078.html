<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Effect 078 — Image flight with center deceleration (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root {
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0806;
    font-family: var(--wpf-font-stack);
    overflow: hidden;
    color: var(--wpf-ink);
  }

  .stage-wrap {
    position: relative;
    width: 100vw; height: calc(100vh - 56px);
    display: flex; align-items: center; justify-content: center;
  }
  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: center center;
    background: radial-gradient(ellipse at center, #fdf8f0 0%, #ede5d2 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.50);
  }

  .brand {
    position: absolute;
    top: 60px; left: 80px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
    opacity: 0;
  }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--wpf-orange); }
  .brand .name { font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--wpf-ink-soft); }

  .scroll-hint {
    position: absolute;
    bottom: 110px; right: 80px;
    z-index: 6;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(20,22,28,0.4);
    opacity: 0;
  }

  /* the flight track — full width, center is the "slow zone" */
  .track {
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 460px;
    margin-top: -230px;
    perspective: 1500px;
    transform-style: preserve-3d;
  }
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 280px;
    height: 360px;
    margin: -180px 0 0 -140px;
    background: white;
    border-radius: 18px;
    box-shadow:
      0 30px 70px rgba(20,22,28,0.20),
      0 6px 18px rgba(20,22,28,0.08);
    overflow: hidden;
    transform-origin: center center;
    will-change: transform, opacity;
    opacity: 0;
    backface-visibility: hidden;
  }
  .card .head {
    padding: 16px 18px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #f1ead8;
  }
  .card .head .badge {
    background: var(--wpf-orange);
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .card[data-c="blue"]   .head .badge { background: var(--wpf-blue); }
  .card[data-c="purple"] .head .badge { background: var(--wpf-ai-purple); }
  .card[data-c="green"]  .head .badge { background: #2c8a55; }
  .card[data-c="amber"]  .head .badge { background: #d59324; }
  .card[data-c="teal"]   .head .badge { background: #2a8a8e; }
  .card[data-c="pink"]   .head .badge { background: #c93874; }
  .card .head .name { font-size: 12px; color: var(--wpf-ink-mute); font-weight: 600; }

  .card .body {
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .body .title {
    font-size: 18px; font-weight: 700;
    color: var(--wpf-ink); letter-spacing: -0.01em; line-height: 1.18;
  }
  .card .body .field {
    background: #f5f1ea;
    border: 1px solid #e2d9c9;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--wpf-ink-mute);
  }
  .card .body .submit {
    background: var(--wpf-orange);
    color: white;
    border-radius: 6px;
    text-align: center;
    padding: 9px;
    font-weight: 700;
    font-size: 12px;
    margin-top: 4px;
  }
  .card[data-c="blue"]   .body .submit { background: var(--wpf-blue); }
  .card[data-c="purple"] .body .submit { background: var(--wpf-ai-purple); }
  .card[data-c="green"]  .body .submit { background: #2c8a55; }
  .card[data-c="amber"]  .body .submit { background: #d59324; }
  .card[data-c="teal"]   .body .submit { background: #2a8a8e; }
  .card[data-c="pink"]   .body .submit { background: #c93874; }

  /* center spotlight — soft glow at the slow zone */
  .spotlight {
    position: absolute;
    top: 50%; left: 50%;
    width: 600px; height: 600px;
    margin: -300px 0 0 -300px;
    background: radial-gradient(circle, rgba(226,119,48,0.16) 0%, rgba(226,119,48,0) 70%);
    z-index: 0;
    pointer-events: none;
    opacity: 0;
  }

  /* heading top */
  .heading {
    position: absolute;
    top: 110px;
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
  }
  .heading .kicker {
    color: var(--wpf-orange);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .heading .title {
    font-size: 56px;
    font-weight: 700;
    color: var(--wpf-ink);
    letter-spacing: -0.025em;
    line-height: 1;
  }

  /* caption bottom */
  .caption {
    position: absolute;
    bottom: 130px;
    left: 0; right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
  }
  .caption .line {
    font-size: 22px;
    color: var(--wpf-ink-soft);
    font-weight: 500;
  }

  /* controls */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 56px;
    background: #0f0d0c; color: #e8e3dc;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    font-family: var(--wpf-font-stack);
    font-size: 13px;
  }
  .controls button {
    background: var(--wpf-orange); color: white; border: 0;
    padding: 8px 16px; border-radius: 6px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .controls button:hover { background: var(--wpf-orange-hover); }
  .controls input[type=range] { flex: 1; accent-color: var(--wpf-orange); }
  .controls .t {
    font-variant-numeric: tabular-nums;
    min-width: 110px; text-align: right; color: #aaa;
  }
  .controls .meta { color: #888; margin-right: 8px; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <div class="brand">
      <div class="dot"></div>
      <div class="name">WPForms</div>
    </div>

    <div class="heading">
      <div class="kicker">1,800+ ready-made templates</div>
      <div class="title">Pick. Customize. Ship.</div>
    </div>

    <div class="spotlight"></div>

    <div class="track" id="track">
      <!-- cards injected by JS -->
    </div>

    <div class="scroll-hint">Scroll →</div>

    <div class="caption">
      <div class="line">Eight categories. Every use case.</div>
    </div>

  </div>
</div>

<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 078 · image flight with center deceleration</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>

<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  // ---------- generate cards ----------
  const cards = [
    { kind: 'Contact',      cls: 'orange', title: 'Quick Contact',      btn: 'Send'    },
    { kind: 'Payment',      cls: 'blue',   title: 'Stripe Checkout',    btn: 'Pay'     },
    { kind: 'AI',           cls: 'purple', title: 'AI Form Generator',  btn: 'Generate'},
    { kind: 'Survey',       cls: 'green',  title: 'NPS Feedback',       btn: 'Submit'  },
    { kind: 'Order',        cls: 'amber',  title: 'Product Order',      btn: 'Buy'     },
    { kind: 'Booking',      cls: 'teal',   title: 'Slot Reservation',   btn: 'Reserve' },
    { kind: 'Lead',         cls: 'pink',   title: 'Lead Magnet',        btn: 'Get it'  },
    { kind: 'Registration', cls: 'orange', title: 'Event RSVP',         btn: 'Sign up' },
  ];

  // deterministic random
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(78);

  const track = document.getElementById('track');
  cards.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.c = c.cls;
    el.innerHTML = `
      <div class="head">
        <div class="badge">${c.kind}</div>
        <div class="name">${c.title.toLowerCase().replace(/[^a-z]/g,'-')}.json</div>
      </div>
      <div class="body">
        <div class="title">${c.title}</div>
        <div class="field">Field</div>
        <div class="field">Field</div>
        <div class="field">Field</div>
        <div class="submit">${c.btn}</div>
      </div>`;
    track.appendChild(el);
  });
  const cardEls = gsap.utils.toArray('.card');

  function fit() {
    const stage = document.getElementById('stage');
    const w = window.innerWidth;
    const h = window.innerHeight - 56;
    const scale = Math.min(w / 1920, h / 1080) * 0.96;
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- master timeline ----------
  // Each card flies right-to-left through the viewport.
  // Custom ease decelerates near the center, accelerates away.
  // 3D rotations vary per card so the parade feels organic.

  const ENTER_X = 1300;
  const EXIT_X = -1300;

  cardEls.forEach((el) => gsap.set(el, { x: ENTER_X, opacity: 0, rotation: 0 }));

  // helper: a custom ease that pauses at center.
  // Phase 1: ease.out from 0 → 0.45 (decelerate into center)
  // Phase 2: linear 0.45 → 0.55 (hold in center band)
  // Phase 3: ease.in from 0.55 → 1.0 (accelerate away)
  function centerSlowEase(p) {
    if (p < 0.45) {
      const t = p / 0.45;
      return 0.45 * (1 - Math.pow(1 - t, 2));     // ease-out into center
    } else if (p < 0.55) {
      return 0.45 + (p - 0.45);                    // hold
    } else {
      const t = (p - 0.55) / 0.45;
      return 0.55 + 0.45 * (t * t);                // ease-in away
    }
  }
  // register as a custom ease
  gsap.registerEase('centerSlow', centerSlowEase);

  const tl = gsap.timeline({ paused: true });

  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.heading', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.2)
    .from('.heading .kicker', { y: 18, opacity: 0, duration: 0.5 }, 0.2)
    .from('.heading .title',  { y: 24, opacity: 0, duration: 0.6 }, 0.35)
    .to('.spotlight', { opacity: 1, duration: 1.0, ease: 'power2.out' }, 0.6)
    .to('.scroll-hint', { opacity: 1, duration: 0.5 }, 0.5);

  const FLIGHT_DUR = 4.2;
  const STAGGER = 0.85;
  const START = 0.8;

  cardEls.forEach((el, i) => {
    const t = START + i * STAGGER;

    // randomized variation per card (deterministic via seeded rng)
    const rotXAmp = (rng() - 0.5) * 18;   // rotation X swing
    const rotYAmp = (rng() - 0.5) * 22;   // rotation Y swing
    const yDrift  = (rng() - 0.5) * 80;   // vertical wander
    const scaleMid = 1.0 + rng() * 0.12;  // slightly larger in the middle

    // entry visible
    tl.to(el, { opacity: 1, duration: 0.4, ease: 'power1.out' }, t);

    // X flight with center-slow ease
    tl.to(el, {
      x: EXIT_X,
      duration: FLIGHT_DUR,
      ease: 'centerSlow'
    }, t);

    // rotations build up around the slow zone — looks like the card "noticing" the camera
    tl.to(el, {
      rotateX: rotXAmp,
      rotateY: rotYAmp,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t);
    tl.to(el, {
      rotateX: 0,
      rotateY: 0,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t + FLIGHT_DUR * 0.5);

    // vertical drift
    tl.to(el, {
      y: yDrift,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t);
    tl.to(el, {
      y: 0,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t + FLIGHT_DUR * 0.5);

    // scale bump at center
    tl.to(el, {
      scale: scaleMid,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t);
    tl.to(el, {
      scale: 1,
      duration: FLIGHT_DUR * 0.5,
      ease: 'sine.inOut'
    }, t + FLIGHT_DUR * 0.5);

    // fade out near exit
    tl.to(el, {
      opacity: 0,
      duration: 0.5,
      ease: 'power1.in'
    }, t + FLIGHT_DUR - 0.5);
  });

  // caption fades in near the end
  const finalT = START + (cardEls.length - 1) * STAGGER + FLIGHT_DUR * 0.5;
  tl.to('.caption', { opacity: 1, duration: 0.7 }, finalT)
    .from('.caption .line', { y: 16, opacity: 0, duration: 0.6 }, finalT);

  // ---------- scrubber ----------
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  const playBtn = document.getElementById('playBtn');

  function updateTime() {
    const t = tl.time(), d = tl.duration();
    timeEl.textContent = t.toFixed(2).padStart(5,'0') + ' / ' + d.toFixed(2).padStart(5,'0');
  }
  scrub.addEventListener('input', () => {
    tl.pause(); playBtn.textContent = 'Play';
    tl.progress(parseFloat(scrub.value)/100); updateTime();
  });
  gsap.ticker.add(() => {
    if (!tl.paused()) {
      scrub.value = (tl.progress()*100).toFixed(2);
      updateTime();
      if (tl.progress() >= 1) playBtn.textContent='Replay';
    }
  });
  playBtn.addEventListener('click', () => {
    if (tl.progress() >= 1) { tl.restart(); playBtn.textContent='Pause'; }
    else if (tl.paused()) { tl.play(); playBtn.textContent='Pause'; }
    else { tl.pause(); playBtn.textContent='Play'; }
  });
  updateTime();
  setTimeout(() => { tl.play(); playBtn.textContent='Pause'; }, 400);
</script>

</body>
</html>
