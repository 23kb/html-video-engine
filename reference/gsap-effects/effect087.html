<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 087 — Staggered card motion with tightening (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .header { position:absolute; top:90px; left:0; right:0; text-align:center; opacity:0; z-index:5; }
  .header .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:8px; }
  .header .title { font-size:48px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }
  .cards { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:60px; will-change:transform; }
  .card { width:280px; height:380px; background:white; border-radius:18px; box-shadow:0 20px 44px rgba(20,22,28,0.18),0 4px 12px rgba(20,22,28,0.08); padding:24px; display:flex; flex-direction:column; gap:12px; will-change:transform; flex-shrink:0; }
  .card-content { display:flex; flex-direction:column; gap:12px; height:100%; will-change:transform,opacity; }
  .top { font-size:17px; font-style:italic; color:var(--wpf-ink-soft); line-height:1.4; }
  .bottom { display:flex; align-items:center; gap:12px; margin-top:auto; }
  .bottom .avatar { width:42px; height:42px; border-radius:50%; background:var(--wpf-orange); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .bottom .who .name { font-weight:700; color:var(--wpf-ink); font-size:14px; }
  .bottom .who .role { color:var(--wpf-ink-mute); font-size:12px; }
  .card[data-c="blue"]   .avatar { background:var(--wpf-blue); }
  .card[data-c="purple"] .avatar { background:var(--wpf-ai-purple); }
  .card[data-c="green"]  .avatar { background:#2c8a55; }
  .card[data-c="amber"]  .avatar { background:#d59324; }
  .card[data-c="teal"]   .avatar { background:#2a8a8e; }
  .card[data-c="pink"]   .avatar { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="header"><div class="kicker">What people say</div><div class="title">Loved by builders.</div></div>
  <div class="cards" id="cards"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 087 · staggered cards with tightening spacing</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const quotes = [
    { c:'orange', q:'"Built our entire intake pipeline in an afternoon."', n:'Anya R.',     r:'Founder, Drift Co.' },
    { c:'blue',   q:'"The AI form generator is uncanny. Saved hours."',    n:'James K.',    r:'Marketing, Hugo' },
    { c:'purple', q:'"Conversions doubled after we switched."',            n:'Mira S.',     r:'Growth Lead' },
    { c:'green',  q:'"The integrations alone are worth the price."',      n:'Daniel W.',   r:'Agency owner' },
    { c:'amber',  q:'"Six million sites can\'t be wrong."',                 n:'Priya N.',    r:'Engineer' },
    { c:'pink',   q:'"Drag-drop just works. Even my CEO can use it."',     n:'Tom L.',      r:'Ops' },
  ];
  const cardsEl = document.getElementById('cards');
  quotes.forEach((q) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.c = q.c;
    el.innerHTML = `<div class="card-content">
      <div class="top">${q.q}</div>
      <div class="bottom">
        <div class="avatar">${q.n[0]}</div>
        <div class="who"><div class="name">${q.n}</div><div class="role">${q.r}</div></div>
      </div>
    </div>`;
    cardsEl.appendChild(el);
  });
  const cards = gsap.utils.toArray('.card');
  const contents = gsap.utils.toArray('.card-content');

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  // initial: cards spaced far apart (the gap CSS), contents hidden
  contents.forEach((c) => gsap.set(c, { y: 40, opacity: 0 }));
  // start the carousel pushed off-screen right
  gsap.set('.cards', { x: 1000 });

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.header', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.25);

  // slide whole row in from right; gap stays wide initially
  tl.to('.cards', { x: 0, duration: 1.6, ease: 'power3.out' }, 0.6);

  // content reveals with stagger
  tl.to(contents, { y: 0, opacity: 1, duration: 0.7, stagger: 0.10, ease: 'power3.out' }, 1.2);

  // TIGHTENING: gap progressively shrinks as we scroll, animated via gap property on .cards
  tl.to(cardsEl, { gap: '10px', duration: 3.0, ease: 'power2.inOut' }, 2.2);

  // gentle final breath
  tl.to(cards, { y: -6, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: { each: 0.06, from: 'center' }}, 4.2);

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
