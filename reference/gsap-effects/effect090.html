<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 090 — Scrubbed random descramble (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .header { position:absolute; top:120px; left:0; right:0; text-align:center; opacity:0; z-index:5; }
  .header .kicker { color:var(--wpf-orange); font-size:14px; font-weight:700; letter-spacing:0.20em; text-transform:uppercase; margin-bottom:10px; }
  .header .title { font-size:38px; font-weight:700; color:var(--wpf-ink); letter-spacing:-0.02em; }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0 80px; }
  .paragraph { font-size:56px; font-weight:600; color:var(--wpf-ink); letter-spacing:-0.02em; line-height:1.2; text-align:center; max-width:1500px; }
  .line-wrap { display:block; position:relative; height:1.2em; margin-bottom:10px; }
  .line-wrap.accent .ch { color:var(--wpf-orange); }
  .ch { display:inline-block; position:absolute; will-change:transform,opacity; opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="header"><div class="kicker">Scrambled · seed 90</div><div class="title">Letters find their place.</div></div>
  <div class="container"><div class="paragraph" id="p">
    <span class="line-wrap"        data-text="Forms are how you ask the world for what you want."></span>
    <span class="line-wrap accent" data-text="WPForms makes the asking easy."></span>
  </div></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 090 · scrubbed random descramble</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
  const rng = mulberry32(90);

  // build each line: characters absolute-positioned at correct slots, but initial state has them at SHUFFLED positions
  const lines = [...document.querySelectorAll('.line-wrap')];
  const lineCharData = [];

  function fit() { const s=document.getElementById('stage'); s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`; }
  addEventListener('resize', fit); fit();

  // First, we need to measure character widths. Easiest: render text invisibly first, measure, then build.
  lines.forEach((line) => {
    const txt = line.dataset.text;
    line.innerHTML = '';

    // temporary inline measure span
    const measureEl = document.createElement('span');
    measureEl.style.cssText = 'visibility:hidden;white-space:nowrap;position:absolute;';
    measureEl.textContent = txt;
    line.appendChild(measureEl);
    const lineWidth = measureEl.scrollWidth;
    line.removeChild(measureEl);

    // build char spans at their correct positions
    let cumX = 0;
    const chars = [];
    [...txt].forEach((c) => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = c === ' ' ? ' ' : c;
      // temp inline measure for this char
      span.style.cssText = 'visibility:hidden;position:relative;';
      line.appendChild(span);
      const w = span.getBoundingClientRect().width;
      // store target X
      span.style.cssText = '';
      span.style.position = 'absolute';
      span.style.left = (cumX) + 'px';
      span.dataset.targetX = cumX;
      chars.push({ el: span, targetX: cumX });
      cumX += w;
    });
    // center the line
    line.style.width = cumX + 'px';
    line.style.left = '50%';
    line.style.transform = 'translateX(-50%)';
    line.style.display = 'block';
    line.style.position = 'relative';
    // however we need lines stacked, so keep .paragraph as the flex container; we just center via margin auto
    line.style.marginLeft = 'auto';
    line.style.marginRight = 'auto';
    lineCharData.push(chars);
  });

  const tl = gsap.timeline({ paused: true });
  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.header', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.25);

  // For each line: chars start at SHUFFLED x positions of other chars; animate to correct x
  lineCharData.forEach((chars, li) => {
    const targets = chars.map(c => c.targetX);
    const shuffled = [...targets];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    chars.forEach((c, i) => {
      // start: at shuffled position, slight y offset, invisible
      gsap.set(c.el, { x: shuffled[i] - c.targetX, y: 30, opacity: 0 });
    });

    const lineStart = 0.8 + li * 2.4;

    // fade in at shuffled positions
    tl.to(chars.map(c => c.el), { opacity: 1, y: 0, duration: 0.4, stagger: 0.015, ease: 'power2.out' }, lineStart);

    // descramble: each char animates to its correct x position
    chars.forEach((c, i) => {
      tl.to(c.el, { x: 0, duration: 1.2, ease: 'power3.inOut' }, lineStart + 0.5 + i * 0.015);
    });
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut(); setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
