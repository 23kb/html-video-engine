<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 091 — 3D wheel gallery (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:radial-gradient(ellipse at center,#1f1810 0%,#0a0806 80%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.5); perspective:1400px; }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; color:rgba(250,246,238,0.9); }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .auto-rotation { position:absolute; top:50%; left:50%; transform-style:preserve-3d; will-change:transform; }
  .wheel-rotation { position:absolute; transform-style:preserve-3d; will-change:transform; }
  .media { position:absolute; top:-90px; left:-130px; width:260px; height:180px; background:white; border-radius:14px; box-shadow:0 16px 36px rgba(0,0,0,0.5); padding:14px; display:flex; flex-direction:column; gap:6px; backface-visibility:hidden; }
  .media .badge { font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .media .ttl { font-size:13px; font-weight:700; color:var(--wpf-ink); }
  .media .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:4px; padding:4px 6px; font-size:9px; color:var(--wpf-ink-mute); }
  .media .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:4px; text-align:center; padding:4px; font-weight:700; font-size:10px; }
  .media[data-c="blue"] .badge,.media[data-c="blue"] .submit { background:var(--wpf-blue); }
  .media[data-c="purple"] .badge,.media[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .media[data-c="green"] .badge,.media[data-c="green"] .submit { background:#2c8a55; }
  .media[data-c="amber"] .badge,.media[data-c="amber"] .submit { background:#d59324; }
  .media[data-c="teal"] .badge,.media[data-c="teal"] .submit { background:#2a8a8e; }
  .media[data-c="pink"] .badge,.media[data-c="pink"] .submit { background:#c93874; }
  .ghost { position:absolute; width:30px; height:30px; border-radius:50%; background:var(--wpf-orange); box-shadow:0 0 24px rgba(226,119,48,0.7); pointer-events:none; z-index:20; transform:translate(-50%,-50%); opacity:0; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="auto-rotation" id="auto"><div class="wheel-rotation" id="wheel"></div></div>
  <div class="ghost" id="ghost"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 091 · 3D wheel gallery cylinder</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const palette=['orange','blue','purple','green','amber','teal','pink'];
  const labels=['Contact','Payment','AI','Survey','Order','Booking','Lead','Event','Donate','Login','Feedback','Waitlist'];
  const wheel=document.getElementById('wheel');
  const N=14; const RADIUS=580;
  for(let i=0;i<N;i++){
    const angle=(i/N)*360;
    const rad=angle*Math.PI/180;
    const x=Math.cos(rad)*RADIUS, z=Math.sin(rad)*RADIUS;
    const el=document.createElement('div');
    el.className='media';el.dataset.c=palette[i%palette.length];
    el.innerHTML=`<div class="badge">${labels[i%labels.length]}</div><div class="ttl">${labels[i%labels.length]}</div><div class="field">F</div><div class="field">F</div><div class="submit">→</div>`;
    el.style.transform=`translate3d(${x}px,0,${z}px) rotateY(${-angle+90}deg)`;
    wheel.appendChild(el);
  }

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const cs={x:960,y:540};
  const ghost=document.getElementById('ghost');
  const auto=document.getElementById('auto');

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);
  tl.to('.ghost',{opacity:1,duration:0.4},0.2);

  const state={spin:0,tilt:0};
  tl.to(state,{spin:360,duration:16,ease:'none',onUpdate:()=>{
    auto.style.transform=`translate(-50%,-50%) rotateX(${-state.tilt*15}deg)`;
    wheel.style.transform=`rotateY(${state.spin}deg)`;
  }},0);

  const wp=[{x:960,y:540},{x:1500,y:300},{x:400,y:800},{x:1600,y:780},{x:300,y:300},{x:960,y:540}];
  let t=0.5;
  for(const w of wp){
    tl.to(state,{tilt:(w.y-540)/540,duration:1.8,ease:'sine.inOut',onUpdate:()=>gsap.set(ghost,{x:w.x,y:540+state.tilt*540})},t);
    t+=1.8;
  }

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
