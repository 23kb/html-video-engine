<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<title>Effect 094 — Orbital scroll around headline (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root { --stage-w: 1920px; --stage-h: 1080px; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0a0806; font-family:var(--wpf-font-stack); overflow:hidden; }
  .stage-wrap { position:relative; width:100vw; height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; }
  .stage { position:relative; width:var(--stage-w); height:var(--stage-h); transform-origin:center; background:linear-gradient(180deg,#fdfaf3 0%,#ede1cb 100%); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.45); }
  .brand { position:absolute; top:60px; left:80px; display:flex; align-items:center; gap:12px; z-index:10; opacity:0; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--wpf-orange); }
  .brand .name { font-weight:600; font-size:22px; letter-spacing:-0.01em; color:var(--wpf-ink-soft); }
  .container { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .headline { font-size:160px; font-weight:800; color:var(--wpf-ink); letter-spacing:-0.03em; line-height:1; text-align:center; z-index:5; }
  .cards { position:absolute; inset:0; pointer-events:none; }
  .card { position:absolute; top:50%; left:50%; width:220px; height:280px; margin:-140px 0 0 -110px; background:white; border-radius:16px; box-shadow:0 18px 40px rgba(20,22,28,0.2); padding:16px; display:flex; flex-direction:column; gap:8px; will-change:transform; }
  .card .badge { font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--wpf-orange); color:white; align-self:flex-start; }
  .card .ttl { font-size:13px; font-weight:700; color:var(--wpf-ink); }
  .card .field { background:#f5f1ea; border:1px solid #e2d9c9; border-radius:5px; padding:5px 7px; font-size:9px; color:var(--wpf-ink-mute); }
  .card .submit { margin-top:auto; background:var(--wpf-orange); color:white; border-radius:5px; text-align:center; padding:5px; font-weight:700; font-size:10px; }
  .card[data-c="blue"] .badge,.card[data-c="blue"] .submit { background:var(--wpf-blue); }
  .card[data-c="purple"] .badge,.card[data-c="purple"] .submit { background:var(--wpf-ai-purple); }
  .card[data-c="green"] .badge,.card[data-c="green"] .submit { background:#2c8a55; }
  .card[data-c="amber"] .badge,.card[data-c="amber"] .submit { background:#d59324; }
  .card[data-c="teal"] .badge,.card[data-c="teal"] .submit { background:#2a8a8e; }
  .card[data-c="pink"] .badge,.card[data-c="pink"] .submit { background:#c93874; }
  .controls { position:fixed; bottom:0; left:0; right:0; height:56px; background:#0f0d0c; color:#e8e3dc; display:flex; align-items:center; gap:16px; padding:0 24px; font-family:var(--wpf-font-stack); font-size:13px; }
  .controls button { background:var(--wpf-orange); color:white; border:0; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  .controls input[type=range] { flex:1; accent-color:var(--wpf-orange); }
  .controls .t { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; color:#aaa; }
  .controls .meta { color:#888; margin-right:8px; }
</style></head><body>
<div class="stage-wrap"><div class="stage" id="stage">
  <div class="brand"><div class="dot"></div><div class="name">WPForms</div></div>
  <div class="container"><div class="headline">FORMS.</div></div>
  <div class="cards" id="cards"></div>
</div></div>
<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 094 · orbital scroll around centered headline</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>
<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  const palette=['orange','blue','purple','green','amber','teal','pink'];
  const labels=['Contact','Payment','AI','Survey','Order','Booking','Lead','Event'];
  const cards=document.getElementById('cards');
  const N=8;
  for(let i=0;i<N;i++){
    const el=document.createElement('div');
    el.className='card';el.dataset.c=palette[i%palette.length];el.dataset.i=i;
    el.innerHTML=`<div class="badge">${labels[i]}</div><div class="ttl">${labels[i]}</div><div class="field">F</div><div class="field">F</div><div class="submit">→</div>`;
    cards.appendChild(el);
  }
  const cs=gsap.utils.toArray('.card');

  function fit(){const s=document.getElementById('stage');s.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-56)/1080)*0.96})`;}
  addEventListener('resize',fit);fit();

  const tl=gsap.timeline({paused:true});
  tl.to('.brand',{opacity:1,duration:0.5,ease:'power2.out'},0.1);

  // each card travels along sine curve L→R; upper cards arc above, lower arc below
  cs.forEach((c,i)=>{
    const startX=-200, endX=2120;
    const isUpper=i%2===0;
    const amp=isUpper?-260:260;
    const startT=0.5+i*0.7;
    const state={p:0};
    tl.fromTo(state,{p:0},{p:1,duration:5,ease:'none',onUpdate:()=>{
      const x=startX+(endX-startX)*state.p-960;
      const y=Math.sin(state.p*Math.PI)*amp;
      c.style.transform=`translate(${x}px,${y}px)`;
    }},startT);
  });

  const sc=document.getElementById('scrub'),te=document.getElementById('time'),pb=document.getElementById('playBtn');
  function ut(){te.textContent=tl.time().toFixed(2).padStart(5,'0')+' / '+tl.duration().toFixed(2).padStart(5,'0');}
  sc.addEventListener('input',()=>{tl.pause();pb.textContent='Play';tl.progress(parseFloat(sc.value)/100);ut();});
  gsap.ticker.add(()=>{if(!tl.paused()){sc.value=(tl.progress()*100).toFixed(2);ut();if(tl.progress()>=1)pb.textContent='Replay';}});
  pb.addEventListener('click',()=>{if(tl.progress()>=1){tl.restart();pb.textContent='Pause';}else if(tl.paused()){tl.play();pb.textContent='Pause';}else{tl.pause();pb.textContent='Play';}});
  ut();setTimeout(()=>{tl.play();pb.textContent='Pause';},400);
</script></body></html>
