<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Effect 098 — Curved SVG textPath reveal (WPForms port)</title>
<link rel="stylesheet" href="../wpforms-brand/tokens.css" />
<style>
  :root {
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0806;
    font-family: var(--wpf-font-stack);
    overflow: hidden;
    color: var(--wpf-ink);
  }

  .stage-wrap {
    position: relative;
    width: 100vw; height: calc(100vh - 56px);
    display: flex; align-items: center; justify-content: center;
  }
  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: center center;
    background: linear-gradient(180deg, #fdfaf3 0%, #ede1cb 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.50);
  }

  .brand {
    position: absolute;
    top: 60px; left: 80px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
    opacity: 0;
  }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--wpf-orange); }
  .brand .name { font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--wpf-ink-soft); }

  .scroll-hint {
    position: absolute;
    top: 60px; right: 80px;
    z-index: 10;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(20,22,28,0.45);
    opacity: 0;
  }

  /* the stack of curved-path lines */
  .lines {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 0 60px;
  }
  .line {
    width: 1600px;
    height: 160px;
    display: block;
  }
  .line svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  /* the curved path is hidden visually — only used as a guide for the textPath */
  .line .guide {
    stroke: none;
    fill: none;
  }
  /* faint baseline indicator (visible during reveal, then fades) */
  .line .ghost {
    stroke: var(--wpf-orange);
    stroke-width: 1.5;
    fill: none;
    opacity: 0;
    stroke-dasharray: 4 6;
  }
  .line text {
    font-family: var(--wpf-font-stack);
    font-weight: 700;
    fill: var(--wpf-ink);
    letter-spacing: -0.005em;
  }
  .line.accent text { fill: var(--wpf-orange); }
  .line tspan {
    opacity: 0;
    will-change: opacity;
  }

  /* footer */
  .footer {
    position: absolute;
    bottom: 110px;
    left: 0; right: 0;
    text-align: center;
    color: var(--wpf-ink-mute);
    font-size: 18px;
    opacity: 0;
  }
  .footer strong { color: var(--wpf-ink); font-weight: 600; }

  /* controls */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 56px;
    background: #0f0d0c; color: #e8e3dc;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    font-family: var(--wpf-font-stack);
    font-size: 13px;
  }
  .controls button {
    background: var(--wpf-orange); color: white; border: 0;
    padding: 8px 16px; border-radius: 6px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .controls button:hover { background: var(--wpf-orange-hover); }
  .controls input[type=range] { flex: 1; accent-color: var(--wpf-orange); }
  .controls .t {
    font-variant-numeric: tabular-nums;
    min-width: 110px; text-align: right; color: #aaa;
  }
  .controls .meta { color: #888; margin-right: 8px; }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <div class="brand">
      <div class="dot"></div>
      <div class="name">WPForms</div>
    </div>

    <div class="scroll-hint">Scroll ↓</div>

    <div class="lines">

      <!-- LINE 1 -->
      <div class="line" data-i="0">
        <svg viewBox="0 0 1600 160" preserveAspectRatio="none">
          <path class="guide" id="p1" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <path class="ghost" id="g1" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <text font-size="92" text-anchor="middle">
            <textPath href="#p1" startOffset="50%">
              <tspan>F</tspan><tspan>o</tspan><tspan>r</tspan><tspan>m</tspan><tspan>s</tspan><tspan> </tspan><tspan>t</tspan><tspan>h</tspan><tspan>a</tspan><tspan>t</tspan><tspan> </tspan><tspan>w</tspan><tspan>o</tspan><tspan>r</tspan><tspan>k</tspan><tspan>.</tspan>
            </textPath>
          </text>
        </svg>
      </div>

      <!-- LINE 2 -->
      <div class="line" data-i="1">
        <svg viewBox="0 0 1600 160" preserveAspectRatio="none">
          <path class="guide" id="p2" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <path class="ghost" id="g2" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <text font-size="92" text-anchor="middle">
            <textPath href="#p2" startOffset="50%">
              <tspan>L</tspan><tspan>o</tspan><tspan>v</tspan><tspan>e</tspan><tspan>d</tspan><tspan> </tspan><tspan>b</tspan><tspan>y</tspan><tspan> </tspan><tspan>b</tspan><tspan>u</tspan><tspan>i</tspan><tspan>l</tspan><tspan>d</tspan><tspan>e</tspan><tspan>r</tspan><tspan>s</tspan><tspan>.</tspan>
            </textPath>
          </text>
        </svg>
      </div>

      <!-- LINE 3 (orange accent) -->
      <div class="line accent" data-i="2">
        <svg viewBox="0 0 1600 160" preserveAspectRatio="none">
          <path class="guide" id="p3" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <path class="ghost" id="g3" d="M0 130 C400 30, 1200 30, 1600 130"></path>
          <text font-size="92" text-anchor="middle">
            <textPath href="#p3" startOffset="50%">
              <tspan>T</tspan><tspan>r</tspan><tspan>u</tspan><tspan>s</tspan><tspan>t</tspan><tspan>e</tspan><tspan>d</tspan><tspan> </tspan><tspan>e</tspan><tspan>v</tspan><tspan>e</tspan><tspan>r</tspan><tspan>y</tspan><tspan>w</tspan><tspan>h</tspan><tspan>e</tspan><tspan>r</tspan><tspan>e</tspan><tspan>.</tspan>
            </textPath>
          </text>
        </svg>
      </div>

    </div>

    <div class="footer">
      <strong>6,000,000 sites</strong> · powered by WPForms
    </div>

  </div>
</div>

<div class="controls">
  <button id="playBtn">Play</button>
  <span class="meta">effect 098 · curved SVG textPath reveal</span>
  <input type="range" id="scrub" min="0" max="100" step="0.1" value="0" />
  <span class="t" id="time">00.00 / 00.00</span>
</div>

<script src="../../vendor/gsap/3.15.0/gsap.min.js"></script>
<script>
  // ---------- responsive stage ----------
  function fit() {
    const stage = document.getElementById('stage');
    const w = window.innerWidth;
    const h = window.innerHeight - 56;
    const scale = Math.min(w / 1920, h / 1080) * 0.96;
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- master timeline ----------
  // Each line: path control points morph from y=30 (heavy arc) to y=130 (flat baseline).
  // Letter tspans fade in left-to-right as the line straightens.
  // Lines reveal sequentially with offset stagger.

  const tl = gsap.timeline({ paused: true });

  tl.to('.brand', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1)
    .to('.scroll-hint', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);

  function setupLine(lineIndex, startTime) {
    const guideId = '#p' + (lineIndex + 1);
    const ghostId = '#g' + (lineIndex + 1);
    const lineSel = '.line[data-i="' + lineIndex + '"]';
    const tspans = document.querySelectorAll(lineSel + ' tspan');

    // proxy for animating path control points
    // d = M0 130 C400 <cy>, 1200 <cy>, 1600 130
    const state = { cy: 30 };

    function updateD() {
      const d = `M0 130 C400 ${state.cy}, 1200 ${state.cy}, 1600 130`;
      document.querySelector(guideId).setAttribute('d', d);
      document.querySelector(ghostId).setAttribute('d', d);
    }
    updateD();

    // ghost fades in briefly at start to show the guide curve
    tl.fromTo(ghostId, { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: 'power2.out' }, startTime);

    // straighten path: cy 30 → 130 over ~1.6s
    tl.to(state, {
      cy: 130,
      duration: 1.6,
      ease: 'power3.inOut',
      onUpdate: updateD
    }, startTime + 0.1);

    // characters fade in with stagger as the curve straightens
    tl.to(tspans, {
      opacity: 1,
      duration: 0.5,
      stagger: 0.035,
      ease: 'power2.out'
    }, startTime + 0.3);

    // ghost fades out once line is straight
    tl.to(ghostId, { opacity: 0, duration: 0.6, ease: 'power2.in' }, startTime + 1.4);
  }

  setupLine(0, 0.7);
  setupLine(1, 1.6);
  setupLine(2, 2.5);

  // footer line fades in at the end
  tl.to('.footer', { opacity: 1, duration: 0.7, ease: 'power2.out' }, 4.0)
    .from('.footer', { y: 14, duration: 0.7 }, 4.0);

  // ---------- scrubber ----------
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  const playBtn = document.getElementById('playBtn');

  function updateTime() {
    const t = tl.time(), d = tl.duration();
    timeEl.textContent = t.toFixed(2).padStart(5,'0') + ' / ' + d.toFixed(2).padStart(5,'0');
  }
  scrub.addEventListener('input', () => {
    tl.pause(); playBtn.textContent = 'Play';
    tl.progress(parseFloat(scrub.value)/100); updateTime();
  });
  gsap.ticker.add(() => {
    if (!tl.paused()) {
      scrub.value = (tl.progress()*100).toFixed(2);
      updateTime();
      if (tl.progress() >= 1) playBtn.textContent='Replay';
    }
  });
  playBtn.addEventListener('click', () => {
    if (tl.progress() >= 1) { tl.restart(); playBtn.textContent='Pause'; }
    else if (tl.paused()) { tl.play(); playBtn.textContent='Pause'; }
    else { tl.pause(); playBtn.textContent='Play'; }
  });
  updateTime();
  setTimeout(() => { tl.play(); playBtn.textContent='Pause'; }, 400);
</script>

</body>
</html>
