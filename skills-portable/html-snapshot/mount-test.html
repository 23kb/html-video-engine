<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot mount test</title>
<!--
  mount-test.html -- prove a snapshot is mountable outside any video system.

  Served by scripts/serve.mjs at /__skill/mount-test.html so it shares an origin with the
  snapshot (cross-origin iframes have no contentDocument and cannot be puppeted).

  Query params:
    snap=/<slug>/index.html   path under the served root (required)
    w=1440 h=900              native iframe size (defaults 1440x900)
    zoom=1.8                  camera scale when landing on the target (default 1.8)
    click=<css selector>      element inside the iframe: camera lands on it, cursor clicks it
                              (a click on an <a> is intercepted: the fossil keeps live hrefs and the
                              live site refuses to be framed; the HUD counts it under "nav intercepted")
    x=<px> y=<px>             focus point in iframe coordinates when there is no click=

  Sequence: mount at native size -> 0.8 s wide hold -> camera flies to the target (1.2 s) while the
  cursor glides to its center (0.9 s) -> a real mousedown/mouseup/click is dispatched on the element
  inside the iframe. Every iframe console error lands in the HUD.

  DevTools: window.mountTest = { camera(pose), cursorTo(sel), click(sel), reset(), poseFor(target, zoom) }
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #14161a; color: #d8dbe0; font: 13px/1.4 ui-monospace, Consolas, "Courier New", monospace; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  /* Fixed 1280x720 stage. It is scaled to fit the window in JS; camera math stays in stage pixels. */
  #stage { position: absolute; width: 1280px; height: 720px; left: 0; top: 0; transform-origin: 0 0; background: #000; overflow: hidden; box-shadow: 0 0 0 1px #2c3038; }
  /* Transform-only camera: scale + translate on a wrapper, never on the iframe itself. */
  #camera { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
  #camera.no-anim { transition: none; }
  #frame { display: block; border: 0; background: #fff; pointer-events: none; }
  #cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; transform: translate(-3px, -2px); transition: left 0.9s cubic-bezier(0.16, 1, 0.3, 1), top 0.9s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 5; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #cursor.pressed { transform: translate(-3px, -2px) scale(0.85); }
  #target-box { position: absolute; border: 1px dashed rgba(255, 200, 80, .9); pointer-events: none; z-index: 4; display: none; }
  #hud { position: fixed; left: 12px; bottom: 12px; max-width: 46vw; max-height: 40vh; overflow: auto; background: rgba(20, 22, 26, .92); border: 1px solid #2c3038; padding: 8px 10px; white-space: pre-wrap; z-index: 10; }
  #hud .err { color: #ff8a80; }
  #hud .ok { color: #9be39b; }
  #hud .warn { color: #ffd479; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="camera"><iframe id="frame" title="snapshot"></iframe></div>
    <div id="target-box"></div>
    <svg id="cursor" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 3 L19 12 L12 13.5 L8.5 20 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
<div id="hud">loading...</div>

<script>
(function () {
  'use strict';

  var STAGE_W = 1280, STAGE_H = 720;
  var q = new URLSearchParams(location.search);
  var snap = q.get('snap') || '';
  var W = parseInt(q.get('w'), 10) || 1440;
  var H = parseInt(q.get('h'), 10) || 900;
  var ZOOM = parseFloat(q.get('zoom')) || 1.8;
  var CLICK = q.get('click') || '';
  var FX = q.has('x') ? parseFloat(q.get('x')) : null;
  var FY = q.has('y') ? parseFloat(q.get('y')) : null;

  var stage = document.getElementById('stage');
  var camera = document.getElementById('camera');
  var frame = document.getElementById('frame');
  var cursor = document.getElementById('cursor');
  var box = document.getElementById('target-box');
  var hud = document.getElementById('hud');

  var state = {
    pose: null,           // {scale, x, y} currently applied
    widePose: null,
    errors: [],           // iframe console errors
    notes: [],
    docSize: null,
    targetRect: null,     // element rect in stage coords
    clicked: false,
    hookMode: null,       // how iframe errors are being captured
    navs: [],             // anchor / submit navigations the hook intercepted (a fossil keeps live hrefs)
  };

  // ---------- stage fit ----------
  function fitStage() {
    var s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    var left = (window.innerWidth - STAGE_W * s) / 2;
    var top = (window.innerHeight - STAGE_H * s) / 2;
    stage.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // ---------- HUD ----------
  function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
  function render() {
    var lines = [];
    lines.push('snap        ' + esc(snap || '(none - pass ?snap=/slug/index.html)'));
    lines.push('iframe      ' + W + 'x' + H + ' native' + (state.docSize ? '  doc ' + state.docSize.w + 'x' + state.docSize.h : ''));
    if (state.pose) lines.push('camera      scale ' + state.pose.scale.toFixed(3) + '  x ' + Math.round(state.pose.x) + '  y ' + Math.round(state.pose.y));
    if (CLICK || FX !== null) lines.push('target      ' + esc(CLICK || ('point ' + FX + ',' + FY)));
    if (state.targetRect) {
      var r = state.targetRect;
      lines.push('target rect ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' (stage px)');
    }
    lines.push('clicked     ' + (state.clicked ? '<span class="ok">yes</span>' : 'no'));
    var errCount = state.errors.length;
    lines.push('<span class="' + (errCount ? 'err' : 'ok') + '" id="hud-errors" data-count="' + errCount + '">console errors ' + errCount + '</span>' + (state.hookMode ? '  (hook: ' + esc(state.hookMode) + ')' : ''));
    state.errors.forEach(function (e) { lines.push('  <span class="err">' + esc(e) + '</span>'); });
    lines.push('<span class="' + (state.navs.length ? 'warn' : 'ok') + '" id="hud-navs" data-count="' + state.navs.length + '">nav intercepted ' + state.navs.length + '</span>' + (state.navs.length ? '  (a fossil keeps live hrefs: the film must own the click)' : ''));
    state.navs.forEach(function (n) { lines.push('  <span class="warn">' + esc(n) + '</span>'); });
    state.notes.forEach(function (n) { lines.push('  <span class="warn">' + esc(n) + '</span>'); });
    hud.innerHTML = lines.join('\n');
  }
  function note(s) { state.notes.push(s); render(); }
  function logError(s) { state.errors.push(s); render(); }
  function logNav(s) { state.navs.push(s); render(); }

  // ---------- iframe error capture ----------
  // Preferred path: scripts/serve.mjs injects a hook <script> into the snapshot when the URL carries
  // ?__hook=1; it runs before any snapshot script and calls this function for every error.
  window.__mountTestOnError = logError;
  window.__mountTestOnNav = logNav;

  // Fallback when another server is in use: attach from the parent AFTER load. A listener added to
  // the initial about:blank window lands on the discarded inner window, and a poll arms after the
  // first inline script has run, so this path cannot see load-time errors and says so in the HUD.
  function hookWindowLate(win) {
    if (!win || win.__mountHook) return;
    win.__mountHook = true;
    // Capture phase: resource load failures (img/link/script 404) never reach onerror.
    win.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== win && t.tagName) logError('resource failed: <' + t.tagName.toLowerCase() + '> ' + (t.src || t.href || ''));
    }, true);
    win.onerror = function (msg, src, line) { logError(String(msg) + (src ? ' @ ' + src + ':' + line : '')); };
    win.addEventListener('unhandledrejection', function (e) { logError('unhandled rejection: ' + (e.reason && e.reason.message || e.reason)); });
    // navigation guard (same as the serve.mjs hook): a click on a live href would navigate the iframe away
    win.addEventListener('click', function (e) { var t = e.target; var a = t && t.closest ? t.closest('a[href]') : null; if (a) { e.preventDefault(); logNav('anchor ' + a.getAttribute('href')); } }, true);
    win.addEventListener('submit', function (e) { e.preventDefault(); logNav('form submit ' + ((e.target && e.target.getAttribute('action')) || '')); }, true);
    if (win.console && typeof win.console.error === 'function') {
      var orig = win.console.error;
      win.console.error = function () {
        logError('console.error: ' + Array.prototype.map.call(arguments, String).join(' '));
        return orig.apply(this, arguments);
      };
    }
    note('error hook armed after load only: errors thrown while the snapshot parsed were not seen (serve with scripts/serve.mjs for load-time coverage)');
  }

  // ---------- camera ----------
  function applyPose(pose, instant) {
    state.pose = pose;
    camera.classList.toggle('no-anim', !!instant);
    camera.style.transform = 'translate(' + pose.x + 'px,' + pose.y + 'px) scale(' + pose.scale + ')';
    if (instant) void camera.offsetWidth; // flush so the next pose animates from here
    render();
  }

  function widePose() {
    var s = Math.min(STAGE_W / W, STAGE_H / H);
    return { scale: s, x: (STAGE_W - W * s) / 2, y: (STAGE_H - H * s) / 2 };
  }

  function iframeDoc() {
    try { return frame.contentDocument; } catch (e) { return null; }
  }

  // Resolve a target (selector string, element, or {x,y} in iframe coords) to its center + rect in iframe doc coords.
  function resolveTarget(target) {
    var doc = iframeDoc();
    if (!doc) return null;
    if (target && typeof target === 'object' && 'x' in target && !(target instanceof Element)) {
      return { cx: target.x, cy: target.y, rect: { left: target.x, top: target.y, width: 0, height: 0 }, el: null };
    }
    var el = typeof target === 'string' ? doc.querySelector(target) : target;
    if (!el) return null;
    var r = el.getBoundingClientRect();
    var win = frame.contentWindow;
    var sx = win.scrollX || 0, sy = win.scrollY || 0;
    return { cx: r.left + sx + r.width / 2, cy: r.top + sy + r.height / 2, rect: { left: r.left + sx, top: r.top + sy, width: r.width, height: r.height }, el: el };
  }

  // Camera pose that puts the target center at stage center at the given zoom.
  function poseFor(target, zoom) {
    var t = resolveTarget(target);
    if (!t) return null;
    var z = zoom || ZOOM;
    return { scale: z, x: STAGE_W / 2 - t.cx * z, y: STAGE_H / 2 - t.cy * z };
  }

  // Iframe doc coords -> stage coords under a pose.
  function toStage(pt, pose) {
    pose = pose || state.pose;
    return { x: pose.x + pt.x * pose.scale, y: pose.y + pt.y * pose.scale };
  }

  function showTargetBox(rect, pose) {
    var a = toStage({ x: rect.left, y: rect.top }, pose);
    var b = toStage({ x: rect.left + rect.width, y: rect.top + rect.height }, pose);
    state.targetRect = { left: a.x, top: a.y, width: b.x - a.x, height: b.y - a.y };
    box.style.display = 'block';
    box.style.left = a.x + 'px'; box.style.top = a.y + 'px';
    box.style.width = (b.x - a.x) + 'px'; box.style.height = (b.y - a.y) + 'px';
    render();
  }

  // ---------- cursor ----------
  function cursorTo(target, pose) {
    var t = resolveTarget(target);
    if (!t) { note('cursorTo: target not found: ' + target); return Promise.resolve(false); }
    var p = toStage({ x: t.cx, y: t.cy }, pose || state.pose);
    cursor.style.left = p.x + 'px';
    cursor.style.top = p.y + 'px';
    return new Promise(function (resolve) { setTimeout(function () { resolve(true); }, 950); });
  }

  // A real event sequence on the element inside the iframe (contentDocument is same-origin).
  function dispatchClick(el) {
    var win = frame.contentWindow;
    var r = el.getBoundingClientRect();
    var init = { bubbles: true, cancelable: true, composed: true, view: win, button: 0, buttons: 1, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
    el.dispatchEvent(new win.MouseEvent('mousedown', init));
    if (el.focus) el.focus();
    init.buttons = 0;
    el.dispatchEvent(new win.MouseEvent('mouseup', init));
    el.dispatchEvent(new win.MouseEvent('click', init));
    state.clicked = true;
    render();
  }

  function click(target) {
    return cursorTo(target).then(function (ok) {
      if (!ok) return false;
      var t = resolveTarget(target);
      if (!t || !t.el) return false;
      cursor.classList.add('pressed');
      dispatchClick(t.el);
      setTimeout(function () { cursor.classList.remove('pressed'); }, 120);
      return true;
    });
  }

  function reset() {
    box.style.display = 'none';
    state.targetRect = null;
    state.clicked = false;
    cursor.style.left = '40px';
    cursor.style.top = '40px';
    applyPose(widePose(), false);
  }

  // ---------- mount ----------
  frame.width = W; frame.height = H;
  frame.style.width = W + 'px'; frame.style.height = H + 'px';
  state.widePose = widePose();
  applyPose(state.widePose, true);
  cursor.style.left = '40px'; cursor.style.top = '40px';

  function onLoaded() {
    var doc = iframeDoc();
    if (!doc) { note('no contentDocument: the snapshot is not same-origin with this page'); return; }
    if (frame.contentWindow.__mountHook) {
      state.hookMode = 'load-time (injected by serve.mjs)';
    } else {
      state.hookMode = 'after load (fallback)';
      hookWindowLate(frame.contentWindow);
    }
    state.docSize = { w: doc.documentElement.scrollWidth, h: doc.documentElement.scrollHeight };
    render();

    var target = CLICK ? CLICK : (FX !== null ? { x: FX, y: FY || 0 } : null);
    if (!target) return;
    var t = resolveTarget(target);
    if (!t) { note('target not found in iframe: ' + CLICK); return; }
    var pose = poseFor(target, ZOOM);

    // Wide hold, then fly + glide together, then click once both have landed.
    setTimeout(function () {
      applyPose(pose, false);
      showTargetBox(t.rect, pose);
      cursorTo(target, pose).then(function () {
        setTimeout(function () {
          if (t.el) { cursor.classList.add('pressed'); dispatchClick(t.el); setTimeout(function () { cursor.classList.remove('pressed'); }, 120); }
        }, 350); // camera transition (1.2 s) outlasts the glide (0.9 s); land first, then press
      });
    }, 800);
  }

  frame.addEventListener('load', onLoaded);
  if (snap) {
    // A 404 body is sniffed as text/plain and still fires load, so ask the server for the status directly.
    fetch(snap, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) note('snapshot returned HTTP ' + r.status + ' for ' + snap + ' (check the snap= path under the served root)');
    }).catch(function (e) { note('could not reach ' + snap + ': ' + e.message); });
    // The marker asks serve.mjs to prepend the error hook; any other static server ignores the query.
    frame.src = snap + (snap.indexOf('?') < 0 ? '?' : '&') + '__hook=1';
  } else {
    note('pass ?snap=/<slug>/index.html to mount a snapshot');
  }
  render();

  window.mountTest = {
    camera: function (pose) { applyPose(pose, false); return pose; },
    cursorTo: function (sel) { return cursorTo(sel); },
    click: function (sel) { return click(sel); },
    reset: reset,
    poseFor: poseFor,
    state: state,
  };
})();
</script>
</body>
</html>
