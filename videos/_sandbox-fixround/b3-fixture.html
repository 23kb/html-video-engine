<!doctype html>
<html>
<head><meta charset="utf-8"><title>B3 camera API fixture</title>
<style>html,body{margin:0}#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#223}</style>
</head>
<body>
<div id="stage"></div>
<script src="/vendor/gsap/3.15.0/gsap.min.js"></script>
<script type="module">
import { IframeManager } from '/videos/_shared/wpforms-interactions.js';
import { flyToElement } from '/videos/_shared/iframe-helpers.js';
const R = { warns: [] };
const origWarn = console.warn;
console.warn = (...a) => { R.warns.push(a.join(' ').slice(0, 120)); origWarn(...a); };
try {
  const ifm = new IframeManager(document.getElementById('stage'), {
    viewport: { width: 1280, height: 720 },
    iframeSize: { width: 1280, height: 720 },
  });
  await ifm.load('builder-settings-anti_spam');
  const wraps = [...ifm.doc().querySelectorAll('.wpforms-panel-content [id^="wpforms-panel-field"]')]
    .filter(w => w.offsetWidth > 0 && w.offsetHeight > 0)
    .sort((a, b) => b.getBoundingClientRect().top - a.getBoundingClientRect().top);
  const low = wraps[0];

  // 1) clampedBy on a low-in-raster target at deep zoom — the Save button
  // lives in the fixed footer at the iframe's bottom edge, where the clamp
  // must bite at zoom 2 (clamp boundary cy=540).
  const save = ifm.doc().querySelector('#wpforms-save');
  const saveRect = save.getBoundingClientRect();
  R.saveTop = Math.round(saveRect.top);
  const pose = ifm.cameraToElement(save, { fill: 0.85, maxZoom: 2.0 });
  R.poseZoom = pose.zoom;
  R.clampedBy = { x: Math.round(pose.clampedBy.x), y: Math.round(pose.clampedBy.y) };
  // and an unclamped mid target must read {0,0}
  R.clampedByMid = ifm.cameraToElement(low, { fill: 0.85, maxZoom: 2.0 }).clampedBy;

  // 2) count tweenCamera calls: decompose default (2) vs false (1)
  const realTween = ifm.tweenCamera.bind(ifm);
  let calls = 0;
  ifm.tweenCamera = (p) => { calls++; return realTween(p); };
  calls = 0;
  await flyToElement({ iframeManager: ifm }, low, { fill: 0.6, duration: 0.3 });
  R.decomposeTrueCalls = calls;
  await realTween({ zoom: 1, tx: 0, ty: 0, duration: 0.2 });
  calls = 0;
  await flyToElement({ iframeManager: ifm }, low, { fill: 0.6, duration: 0.3, decompose: false });
  R.decomposeFalseCalls = calls;
  ifm.tweenCamera = realTween;

  // 3) wide-element no-op-zoom warn
  await realTween({ zoom: 1, tx: 0, ty: 0, duration: 0.2 });
  const wide = [...ifm.doc().querySelectorAll('.wpforms-panel-content')]
    .find(e => e.offsetWidth > 0 && e.offsetHeight > 0);
  R.wideW = wide && wide.offsetWidth;
  await flyToElement({ iframeManager: ifm }, wide, { fill: 0.32, duration: 0.3 });
  R.noopWarn = R.warns.some(w => w.includes('[camera]') && w.includes('within 10%'));

  window.__results = R;
} catch (e) { window.__results = { error: String(e.message), stack: String(e.stack).slice(0, 300), warns: R.warns }; }
</script>
</body>
</html>
